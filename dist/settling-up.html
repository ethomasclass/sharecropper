    scene.add(wagon);

    // flood water and rain, hidden until a card calls for them
    flood = new THREE.Mesh(new THREE.PlaneGeometry(30, 12), new THREE.MeshLambertMaterial({ color: 0x4c5c7e, transparent: true, opacity: 0.78 }));
    flood.rotation.x = -Math.PI / 2;
    flood.position.set(0, 0.32, -1.6);
    flood.visible = false;
    scene.add(flood);
    const drops = new Float32Array(900 * 6);
    const rg = new THREE.BufferGeometry();
    rg.setAttribute("position", new THREE.BufferAttribute(drops, 3));
    rain = new THREE.LineSegments(rg, new THREE.LineBasicMaterial({ color: 0xf6efdf, transparent: true, opacity: 0.55 }));
    rain.visible = false;
    rain.frustumCulled = false;
    scene.add(rain);
    for (let i = 0; i < 900; i++) resetDrop(i, true);
  }

  function resetDrop(i, any) {
    const a = rain.geometry.attributes.position.array;
    const x = pos.x + (Math.random() - 0.5) * 40, z = pos.z + (Math.random() - 0.5) * 40;
    const y = any ? Math.random() * 14 : 14;
    a.set([x, y, z, x - 0.08, y - 0.7, z], i * 6);
  }

  // ---- input ----------------------------------------------------------------
  const ray = () => new THREE.Raycaster();
  let raycaster;
  function pickAt(clientX, clientY) {
    const r = renderer.domElement.getBoundingClientRect();
    v.ndc.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
    raycaster.setFromCamera(v.ndc, camera);
    const hits = raycaster.intersectObjects(clickables.filter((m) => isVisible(m)), false);
    for (const h of hits) {
      const c = h.object.userData.click;
      if (!c) continue;
      return { ...c, point: h.point, distance: h.distance, object: h.object };
    }
    return null;
  }
  function isVisible(m) {
    let o = m;
    while (o) { if (!o.visible) return false; o = o.parent; }
    return true;
  }

  function onPointerDown(e) {
    if (mode === "locked") return;
    drag = { x: e.clientX, y: e.clientY, yaw: look.yaw, pitch: look.pitch, moved: false, id: e.pointerId };
    renderer.domElement.setPointerCapture?.(e.pointerId);
  }
  function onPointerMove(e) {
    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 6) drag.moved = true;
      if (drag.moved) {
        look.yaw = drag.yaw - dx * 0.0042;
        look.pitch = Math.max(-1.1, Math.min(0.7, drag.pitch - dy * 0.0036));
      }
      return;
    }
    if (mode === "locked" || e.pointerType === "touch") return;
    const hit = pickAt(e.clientX, e.clientY);
    setHover(hit && hit.kind !== "ground" ? hit : null, e.clientX, e.clientY);
  }
  function onPointerUp(e) {
    if (!drag) return;
    const wasDrag = drag.moved;
    drag = null;
    if (wasDrag || mode === "locked") return;
    const hit = pickAt(e.clientX, e.clientY);
    if (!hit) return;
    handleClick(hit);
  }

  function handleClick(hit) {
    if (hit.kind === "ground") {
      if (mode === "free" || mode === "plant" || mode === "harvest") walkToPoint(hit.point.x, hit.point.z);
      return;
    }
    if (hit.kind === "plot" || hit.kind === "plant") {
      const index = hit.kind === "plot" ? hit.index : hit.plot;
      if (mode === "plant") handlers.plot?.(index);
      else if (mode === "free" || mode === "harvest") walkToPoint(hit.point.x, hit.point.z);
      return;
    }
    if (hit.kind === "place" || hit.kind === "person") handlers.interact?.(hit.kind === "place" ? hit.name : hit.id);
  }

  function setHover(hit, x, y) {
    if (hovered && hovered.kind === "plot") plots[hovered.index].tile.material = plots[hovered.index].corn ? mats.soilCorn : mats.soil;
    hovered = hit;
    let label = "";
    if (hit) {
      if (hit.kind === "plot" && mode === "plant") {
        plots[hit.index].tile.material = mats.soilHover;
        label = plots[hit.index].corn ? "Corn · tap for cotton" : "Cotton · tap for corn";
      } else if (hit.kind === "person") {
        const names = { mama: "Mama", lucy: "Lucy", sam: "Sam", ruth: "Grandma Ruth", holliday: "Mr. " + (handlers.planterName?.() || "Holliday"), mule: "The mule" };
        label = names[hit.id] || "";
      } else if (hit.kind === "place") {
        label = { cabin: "Your cabin", store: "The store", gin: "The gin scale", porch: "The big house", school: "The church school" }[hit.name] || "";
      }
    }
    renderer.domElement.style.cursor = label ? "pointer" : (mode === "locked" ? "default" : "grab");
    if (label) {
      tagEl.textContent = label;
      tagEl.hidden = false;
      const r = container.getBoundingClientRect();
      tagEl.style.left = (x - r.left + 14) + "px";
      tagEl.style.top = (y - r.top + 14) + "px";
    } else tagEl.hidden = true;
  }

  function onKey(e, down) {
    if (e.target && /INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName) && e.key !== "Escape") return;
    const k = e.key.toLowerCase();
    if (["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright", "q", "e"].includes(k)) {
      keys[k] = down;
      if (down && mode !== "locked") { walk = null; e.preventDefault(); }
    }
  }

  // ---- movement -------------------------------------------------------------
  function collide(x, z) {
    for (const [a, b, c, d] of colliders) {
      if (x > a && x < c && z > b && z < d) {
        const dl = x - a, dr = c - x, dt = z - b, db = d - z;
        const m = Math.min(dl, dr, dt, db);
        if (m === dl) x = a; else if (m === dr) x = c; else if (m === dt) z = b; else z = d;
      }
    }
    const rr = Math.hypot(x, z);
    if (rr > 60) { x *= 60 / rr; z *= 60 / rr; }
    return [x, z];
  }

  function walkToPoint(x, z, faceTo) {
    return new Promise((resolve) => {
      const dx = x - pos.x, dz = z - pos.z;
      const yaw = faceTo ? Math.atan2(-(faceTo[0] - x), -(faceTo[2] - z)) : Math.atan2(-dx, -dz);
      walk = { x, z, yaw, pitch: null, resolve, turnFirst: true };
    });
  }

  function walkTo(name) {
    const p = PLACES[name];
    if (!p) return Promise.resolve();
    return new Promise((resolve) => {
      const yaw = Math.atan2(-(p.face[0] - p.x), -(p.face[2] - p.z));
      walk = { x: p.x, z: p.z, yaw, pitch: p.pitch, resolve };
      if (reduceMotion || !ok) { pos.x = p.x; pos.z = p.z; look.yaw = yaw; look.pitch = p.pitch; finishWalk(); }
    });
  }
  function finishWalk() {
    const w = walk;
    walk = null;
    if (w && w.path && w.path.length) {
      const [nx, nz] = w.path[0];
      walk = { ...w, x: nx, z: nz, yaw: Math.atan2(-(nx - w.x), -(nz - w.z)), path: w.path.slice(1) };
      return;
    }
    w?.resolve?.();
  }

  function angleDiff(a, b) {
    let d = a - b;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return d;
  }

  function step(dt) {
    // keyboard walking
    const fwd = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0);
    const side = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
    const turn = (keys.arrowleft || keys.q ? 1 : 0) - (keys.arrowright || keys.e ? 1 : 0);
    if (mode !== "locked") {
      look.yaw += turn * dt * 1.6;
      if (fwd || side) {
        const sp = 5 * dt;
        const fx = -Math.sin(look.yaw), fz = -Math.cos(look.yaw);
        const rx = Math.cos(look.yaw), rz = -Math.sin(look.yaw);
        const nx = pos.x + (fx * fwd + rx * side) * sp;
        const nz = pos.z + (fz * fwd + rz * side) * sp;
        [pos.x, pos.z] = collide(nx, nz);
      }
    }
    // auto walking
    if (walk) {
      const dx = walk.x - pos.x, dz = walk.z - pos.z;
      const dist = Math.hypot(dx, dz);
      const heading = dist > 0.3 ? Math.atan2(-dx, -dz) : walk.yaw;
      const target = dist > 1.2 ? heading : walk.yaw;
      look.yaw += angleDiff(target, look.yaw) * Math.min(1, dt * 4);
      if (walk.pitch != null) look.pitch += (walk.pitch - look.pitch) * Math.min(1, dt * 3);
      if (dist > 0.05) {
        const sp = Math.min(dist, 6.5 * dt);
        [pos.x, pos.z] = collide(pos.x + (dx / dist) * sp, pos.z + (dz / dist) * sp);
        if (Math.hypot(walk.x - pos.x, walk.z - pos.z) > dist - 0.0001 && dist < 1) { pos.x = walk.x; pos.z = walk.z; }
      }
      if (dist < 0.06 && Math.abs(angleDiff(walk.yaw, look.yaw)) < 0.06 && (walk.pitch == null || Math.abs(walk.pitch - look.pitch) < 0.04)) {
        look.yaw = walk.yaw;
        if (walk.pitch != null) look.pitch = walk.pitch;
        finishWalk();
      }
    }
    camera.position.set(pos.x, heightAt(pos.x, pos.z) + EYE, pos.z);
    camera.rotation.set(look.pitch, look.yaw, 0, "YXZ");

    // harvest: the cotton comes off the plants Papa walks past
    if (mode === "harvest") {
      let changed = false;
      for (const p of plants) {
        if (p.picked || plots[p.plot].corn || !p.group.visible) continue;
        if (Math.hypot(p.x - pos.x, p.z - pos.z) < 2.4) {
          p.picked = true;
          setPlantTexture(p, "cottonPicked");
          pop(p.group);
          changed = true;
        }
      }
      if (changed) handlers.harvest?.(harvestFraction());
    }

    // cutouts turn to face Papa, like paper standees
    for (const b of billboards) {
      if (!b.visible) continue;
      b.rotation.y = Math.atan2(camera.position.x - b.position.x, camera.position.z - b.position.z);
    }
    // tweens
    for (let i = tweens.length - 1; i >= 0; i--) {
      const t = tweens[i];
      t.t += dt / t.dur;
      const k = Math.min(1, t.t);
      t.fn(k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2, k);
      if (k >= 1) { tweens.splice(i, 1); t.done?.(); }
    }
    // rain
    if (rain.visible) {
      const a = rain.geometry.attributes.position.array;
      for (let i = 0; i < 900; i++) {
        a[i * 6 + 1] -= dt * 16; a[i * 6 + 4] -= dt * 16;
        if (a[i * 6 + 4] < 0) resetDrop(i, false);
      }
      rain.geometry.attributes.position.needsUpdate = true;
    }
    // speech bubble follows its speaker
    if (bubble) {
      const m = people[bubble.id] || muleCut;
      v.tmp.copy(m.position); v.tmp.y += (m.geometry.parameters?.height || 1.6) + 0.25;
      v.tmp.project(camera);
      const r = container.getBoundingClientRect();
      if (v.tmp.z < 1) {
        bubbleEl.style.left = ((v.tmp.x + 1) / 2) * r.width + "px";
        bubbleEl.style.top = ((1 - v.tmp.y) / 2) * r.height + "px";
        bubbleEl.hidden = false;
      } else bubbleEl.hidden = true;
      bubble.t -= dt;
      if (bubble.t <= 0) { bubble = null; bubbleEl.hidden = true; }
    }
  }

  function harvestFraction() {
    const cotton = plants.filter((p) => !plots[p.plot].corn && p.group.visible);
    return cotton.length ? cotton.filter((p) => p.picked).length / cotton.length : 1;
  }

  function tween(dur, fn, done) {
    if (reduceMotion) { fn(1, 1); done?.(); return; }
    tweens.push({ t: 0, dur, fn, done });
  }
  function pop(g) {
    const s = g.scale.x;
    tween(0.25, (k, raw) => { const b = 1 + Math.sin(raw * Math.PI) * 0.25; g.scale.set(s * b, s * b, s * b); });
  }

  function loop(t) {
    requestAnimationFrame(loop);
    if (document.hidden) return;
    const dt = Math.min(0.1, (t - lastT) / 1000 || 0.016);
    lastT = t;
    step(dt);
    renderer.render(scene, camera);
  }

  function resize() {
    const w = container.clientWidth, h = container.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w / h < 0.9 ? 70 : 58;
    camera.updateProjectionMatrix();
  }

  // ---- crop and season state ---------------------------------------------
  let stage = "plan";
  function setPlantTexture(p, name) {
    const t = tex[name];
    const isCorn = name.startsWith("corn");
    const h = { sprout: 0.5, cornSprout: 0.95, cottonGrow: 1.0, cottonRipe: 1.05, cottonPicked: 1.0, cornGrow: 2.1, cornRipe: 2.1 }[name] || 1;
    p.group.children.forEach((m) => {
      m.material = mats["plant_" + name] || (mats["plant_" + name] = new THREE.MeshBasicMaterial({ map: t, transparent: true, alphaTest: 0.35, side: THREE.DoubleSide }));
      const aspect = t.image.width / t.image.height;
      m.geometry.dispose();
      const g = new THREE.PlaneGeometry(h * aspect, h);
      g.translate(0, h / 2, 0);
      m.geometry = g;
    });
    p.kind = isCorn ? "corn" : "cotton";
  }
  function refreshPlants() {
    plots.forEach((plot) => {
      plot.tile.material = plot.corn ? mats.soilCorn : mats.soil;
      plot.plants.forEach((p) => {
        let name;
        if (plot.corn) name = stage === "plan" ? "cornSprout" : stage === "grow" ? "cornGrow" : "cornRipe";
        else if (stage === "plan") name = "sprout";
        else if (stage === "grow") name = "cottonGrow";
        else name = p.picked || stage === "picked" ? "cottonPicked" : "cottonRipe";
        setPlantTexture(p, name);
      });
    });
  }

  const SKIES = {
    spring: [0xe8d6a8, 0x9fa262], summer: [0xe3c587, 0x8c9550], fall: [0xd9b16a, 0xa38f54],
    dusk: [0x3a4466, 0x5b5a40], drought: [0xe7b56a, 0xb9965a],
  };
  function setSky(name) {
    const [sky, grass] = SKIES[name] || SKIES.spring;
    scene.background.setHex(sky);
    scene.fog.color.setHex(sky);
    groundMats.forEach((m) => m.color.setHex(grass));
    const dusk = name === "dusk";
    Object.values(mats).forEach((m) => { if (m && m.isMeshBasicMaterial && m.map && m !== mats.blob) m.color.setHex(dusk ? 0x9aa0b8 : 0xffffff); });
    billboards.forEach((b) => b.material.color.setHex(dusk ? 0xb8bccc : 0xffffff));
  }

  // ---- public API -----------------------------------------------------------
  async function init(el) {
    container = el;
    reduceMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches || false;
    try {
      THREE = await import(THREE_URL);
      const test = document.createElement("canvas");
      if (!(test.getContext("webgl2") || test.getContext("webgl"))) throw new Error("no webgl");
      v.ndc = new THREE.Vector2(); v.tmp = new THREE.Vector3();
      raycaster = ray();
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "low-power" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      el.prepend(renderer.domElement);
      renderer.domElement.className = "world-canvas";
      renderer.domElement.setAttribute("aria-label", "The farm, seen through Papa's eyes. Drag to look around, tap to walk or act.");
      renderer.domElement.setAttribute("role", "img");
      scene = new THREE.Scene();
      scene.background = new THREE.Color(SKIES.spring[0]);
      scene.fog = new THREE.Fog(SKIES.spring[0], 45, 140);
      camera = new THREE.PerspectiveCamera(58, 1, 0.1, 400);
      const names = Object.keys(SPRITES);
      const loaded = await Promise.all(names.map((n) => svgToTexture(SPRITES[n]())));
      if (loaded.some((t) => !t)) throw new Error("sprites");
      names.forEach((n, i) => { tex[n] = loaded[i]; });
      build();
      refreshPlants();
      tagEl = el.querySelector(".world-tag");
      bubbleEl = el.querySelector(".world-bubble");
      hintEl = el.querySelector(".world-hint");
      const c = renderer.domElement;
      c.addEventListener("pointerdown", onPointerDown);
      c.addEventListener("pointermove", onPointerMove);
      c.addEventListener("pointerup", onPointerUp);
      c.addEventListener("pointercancel", () => { drag = null; });
      c.addEventListener("pointerleave", () => { if (!drag) setHover(null); });
      window.addEventListener("keydown", (e) => onKey(e, true));
      window.addEventListener("keyup", (e) => onKey(e, false));
      new ResizeObserver(resize).observe(el);
      resize();
      ok = true;
      requestAnimationFrame(loop);
      return true;
    } catch (err) {
      console.warn("3D world unavailable, using flat screens.", err);
      ok = false;
      return false;
    }
  }

  return {
    get ok() { return ok; },
    get debug() { return { x: pos.x, z: pos.z, yaw: look.yaw, pitch: look.pitch, walking: !!walk, mode }; },
    init,
    on(h) { handlers = { ...handlers, ...h }; },
    setMode(m) {
      mode = m;
      if (!ok) return;
      renderer.domElement.style.cursor = m === "locked" ? "default" : "grab";
      if (m === "locked") { setHover(null); Object.keys(keys).forEach((k) => { keys[k] = false; }); }
    },
    walkTo(name) { return ok ? walkTo(name) : Promise.resolve(); },
    place(name) {
      const p = PLACES[name];
      if (!ok || !p) return;
      pos.x = p.x; pos.z = p.z;
      look.yaw = Math.atan2(-(p.face[0] - p.x), -(p.face[2] - p.z));
      look.pitch = p.pitch;
      walk = null;
    },
    setCorn(set) {
      if (!ok) return;
      plots.forEach((p) => { p.corn = set.has(p.index); });
      refreshPlants();
    },
    setStage(s) {
      stage = s;
      if (!ok) return;
      if (s !== "ripe") plants.forEach((p) => { p.picked = false; });
      refreshPlants();
    },
    setSky(name) { if (ok) setSky(name); },
    setWeather(w) {
      if (!ok) return;
      rain.visible = w === "rain";
      flood.visible = w === "flood";
      if (w === "flood") plots.forEach((p) => p.plants.forEach((pl) => { if (p.corn) pl.group.visible = false; }));
      else plants.forEach((pl) => { pl.group.visible = true; });
      if (w === "drought") setSky("drought");
    },
    setFlags({ mule: muleState, school: schoolOn } = {}) {
      if (!ok) return;
      if (muleState != null) muleCut.visible = muleState !== "none";
      if (schoolOn != null) school.visible = schoolOn;
    },
    setPeople(where) {
      if (!ok) return;
      const spots = {
        home: { mama: [-12.3, 11.4, "mama"], lucy: [-13.4, 13.8, "lucy"], sam: [-12.6, 12.6, "sam"], ruth: [-14.4, 14.6, "ruth"] },
        field: { mama: [-2.2, 5.6, "mamaWork"], lucy: [3.4, 5.8, "lucyWork"], sam: [5.6, 6.6, "samWork"], ruth: [-13.9, 12.4, "ruth"] },
        porch: { mama: [1.6, -21.6, "mama"], lucy: [-13.4, 13.8, "lucy"], sam: [-12.6, 12.6, "sam"], ruth: [-14.4, 14.6, "ruth"] },
        store: { mama: [12.2, 5.4, "mama"], lucy: [-13.4, 13.8, "lucy"], sam: [-12.6, 12.6, "sam"], ruth: [-14.4, 14.6, "ruth"] },
      }[where] || {};
      Object.entries(spots).forEach(([id, [x, z, t]]) => {
        const m = people[id];
        m.position.set(x, heightAt(x, z) + (id === "ruth" && where !== "field" ? 0.2 : 0), z);
        m.material.map = tex[t];
        m.material.needsUpdate = true;
      });
    },
    say(id, text, seconds = 4.5) {
      if (!ok || !bubbleEl) return;
      bubbleEl.textContent = text;
      bubble = { id, t: seconds };
    },
    hint(text) {
      if (!hintEl) return;
      hintEl.textContent = text || "";
      hintEl.hidden = !text;
    },
    harvestFraction() { return ok ? harvestFraction() : 0; },
    // Walk every row of the field, front to back.
    walkRows() {
      if (!ok) return Promise.resolve();
      const route = [[-10.5, 6.6], [10.5, 6.6], [10.5, 2.2], [-10.5, 2.2], [-10.5, -2.2], [10.5, -2.2], [10.5, -6.4], [-10.5, -6.4]];
      return new Promise((resolve) => {
        const [x, z] = route[0];
        walk = { x, z, yaw: Math.atan2(-(x - pos.x), -(z - pos.z)), pitch: -0.42, resolve, path: route.slice(1) };
      });
    },
    // Harvest: load the wagon and roll it to the scale. Calls back with the
    // planter's weight once the needle settles.
    harvestRun(bales, scaleLbs, maxLbs) {
      if (!ok) return Promise.resolve();
      return new Promise((resolve) => {
        wagon.userData.bales.forEach((b) => wagon.remove(b));
        wagon.userData.bales = [];
        const n = Math.max(1, Math.round(bales));
        for (let i = 0; i < n; i++) {
          const b = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.6, 0.6), lambert(0xf6efdf));
          b.position.set(-0.8 + (i % 3) * 0.8, 1.45 + Math.floor(i / 3) * 0.62, (i % 2) * 0.1 - 0.05);
          const tie = new THREE.Mesh(new THREE.BoxGeometry(0.78, 0.62, 0.06), lambert(0x4f2f1d));
          b.add(tie);
          wagon.add(b);
          wagon.userData.bales.push(b);
        }
        wagon.visible = true;
        wagon.position.set(4, 0, 8);
        muleCut.userData.home = muleCut.userData.home || muleCut.position.clone();
        const muleWasVisible = muleCut.visible;
        muleCut.visible = true;
        scaleNeedle.rotation.z = Math.PI * 0.6;
        walkTo("gin");
        tween(3.2, (k) => {
          wagon.position.set(4 + (13.6 - 4) * k, 0.25 * k, 8);
          muleCut.position.set(wagon.position.x + 2.4, 0, wagon.position.z);
        }, () => {
          const frac = Math.min(1, scaleLbs / maxLbs);
          tween(1.8, (k) => { scaleNeedle.rotation.z = Math.PI * 0.6 - k * frac * Math.PI * 1.4; }, () => {
            setTimeout(() => {
              muleCut.position.copy(muleCut.userData.home);
              muleCut.visible = muleWasVisible;
              resolve();
            }, 250);
          });
        });
      });
    },
    hideWagon() { if (ok) wagon.visible = false; },
    setPlanter(name) {
      if (!ok || mats.storeSign.userData.name === name) return;
      mats.storeSign.material.map?.dispose();
      mats.storeSign.material.map = textTexture([name.toUpperCase(), "STORE & GIN"], { size: 46 });
      mats.storeSign.material.needsUpdate = true;
      mats.storeSign.userData.name = name;
    },
  };
})();

// ============================================================================
// GAME — the flow: join, contract, five crop years, ending, audit.
// ============================================================================
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function fmt(n) {
  const v = Math.abs(n) < 0.005 ? 0 : n;
  const s = Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (v < 0 ? "−$" : "$") + s;
}
const fmtLbs = (n) => Math.round(n).toLocaleString("en-US") + " lb";
const fmtBales = (n) => (Math.round(n * 100) / 100).toLocaleString("en-US", { maximumFractionDigits: 2 });

const SAVE_KEY = "settling-up:v1";
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage off */ } },
  del(k) { try { localStorage.removeItem(k); } catch { /* storage off */ } },
};

const Game = {
  g: null,
  y: null,
  classroom: null,       // { mode, year, revealed } from the teacher, when live
  els: {},
  corn: new Set(),

  // ---- text helpers -------------------------------------------------------
  planter() { return PLANTERS[Math.min(this.g?.planterIndex || 0, PLANTERS.length - 1)]; },
  t(s) {
    return String(s || "")
      .replaceAll("{F}", this.g?.family || "")
      .replaceAll("{P}", this.planter())
      .replaceAll("{Y}", this.y?.year || "")
      .replaceAll("Mr. Holliday", "Mr. " + this.planter());
  },
  log(text, kind = "story") {
    if (!this.g) return;
    this.g.journal = this.g.journal || [];
    const last = this.g.journal[this.g.journal.length - 1];
    if (last && last.text === text) return;
    this.g.journal.push({ year: this.y?.year || CONFIG.years[0], kind, text });
  },
  save() {
    if (!this.g) return;
    this.g.cur = this.y;
    this.g.cornPlots = [...this.corn];
    store.set(SAVE_KEY, this.g);
    Sync.saveFamily(this.g);
    this.renderTopbar();
  },

  // ---- boot ----------------------------------------------------------------
  async boot() {
    this.els = {
      topbar: $("#topbar"), world: $("#world"), flat: $("#world-flat"), dock: $("#dock"),
      sheet: $("#sheet"), sheetBody: $("#sheet-body"), cut: $("#cutscene"), journal: $("#journal"),
      teacher: $("#teacher"),
    };
    World.on({
      plot: (i) => this.togglePlot(i),
      harvest: (f) => this.onHarvest(f),
      interact: (name) => this.onInteract(name),
      planterName: () => this.planter(),
    });
    $("#journal-btn").addEventListener("click", () => this.openJournal());
    const setTop = () => document.documentElement.style.setProperty("--top", this.els.topbar.offsetHeight + "px");
    new ResizeObserver(setTop).observe(this.els.topbar);
    setTop();
    $("#journal-close").addEventListener("click", () => { this.els.journal.hidden = true; });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !this.els.journal.hidden) this.els.journal.hidden = true;
    });
    this.showFlat("fieldSun");
    const worldReady = World.init(this.els.world);
    Sync.init();
    if (location.hash === "#teacher") { Teacher.open(); return; }
    await worldReady;
    if (World.ok) this.els.flat.hidden = true;
    else document.querySelector(".world-help")?.remove();
    this.showJoin();
  },

  showFlat(art) {
    if (World.ok) { this.els.flat.hidden = true; return; }
    this.els.flat.hidden = false;
    this.els.flat.innerHTML = sceneSVG(art, "");
  },

  // ---- top bar ------------------------------------------------------------
  renderTopbar() {
    const g = this.g;
    const yrs = CONFIG.years.map((yr, i) => {
      const done = g && g.years[i];
      const cur = g && !g.ending && i === g.yearIndex;
      const bal = done ? `<span class="chip-bal ${done.ledger.balance < 0 ? "neg" : ""}">${fmt(done.ledger.balance)}</span>` : "";
      return `<li class="${cur ? "cur" : ""} ${done ? "done" : ""}" aria-current="${cur ? "step" : "false"}"><span class="chip-yr">${yr}</span>${bal}</li>`;
    }).join("");
    $("#years").innerHTML = yrs;
    $("#fam").innerHTML = g ? `The ${esc(g.family)} family${g.ownMule ? ' · <span class="tag">own mule</span>' : ""}${g.education ? ' · <span class="tag">Lucy reads</span>' : ""}` : "";
  },

  // ---- dock: the small card in the corner --------------------------------
  dock(html) {
    this.els.dock.innerHTML = html;
    this.els.dock.hidden = !html;
  },
  sheet(html, opts = {}) {
    this.els.sheetBody.innerHTML = html;
    this.els.sheet.hidden = false;
    this.els.sheet.classList.toggle("wide", !!opts.wide);
    this.els.sheet.classList.toggle("low", !!opts.low);
    this.els.sheet.scrollTop = 0;
    this.els.sheetBody.scrollTop = 0;
    World.setMode("locked");
    const first = this.els.sheetBody.querySelector("[autofocus], input, button.primary");
    setTimeout(() => first?.focus({ preventScroll: true }), 30);
  },
  closeSheet() { this.els.sheet.hidden = true; },

  // ---- cutscenes -----------------------------------------------------------
  cutscene(panels) {
    return new Promise((resolve) => {
      let i = 0;
      const el = this.els.cut;
      World.setMode("locked");
      const show = () => {
        const p = panels[i];
        const cap = this.t(p.caption), sub = this.t(p.sub || "");
        this.log(cap + (sub ? " " + sub : ""), "cutscene");
        el.innerHTML = `
          <div class="cut-frame"><div class="cut-art">${sceneSVG(p.art, cap)}</div></div>
          <div class="cut-text">
            <p class="cut-cap">${esc(cap)}</p>
            ${sub ? `<p class="cut-sub">${esc(sub)}</p>` : ""}
            <div class="cut-nav">
              <span class="cut-count">${i + 1} / ${panels.length}</span>
              <button class="ghost" data-skip>Skip</button>
              <button class="primary" data-next autofocus>${i === panels.length - 1 ? "Continue" : "Next"}</button>
            </div>
          </div>`;
        el.hidden = false;
        el.querySelector("[data-next]").focus({ preventScroll: true });
      };
      const next = () => { i++; if (i >= panels.length) finish(); else show(); };
      const finish = () => {
        el.hidden = true;
        el.removeEventListener("click", onClick);
        document.removeEventListener("keydown", onKey);
        this.save();
        resolve();
      };
      const onClick = (e) => {
        if (e.target.closest("[data-skip]")) { finish(); return; }
        next();
      };
      const onKey = (e) => {
        if (["Enter", " ", "ArrowRight"].includes(e.key)) { e.preventDefault(); next(); }
        if (e.key === "Escape") finish();
      };
      el.addEventListener("click", onClick);
      document.addEventListener("keydown", onKey);
      show();
    });
  },

  // ---- join -----------------------------------------------------------------
  showJoin() {
    const saved = store.get(SAVE_KEY);
    const resume = saved && saved.v === 1 && saved.step !== "done" ? saved : null;
    this.dock("");
    this.sheet(`
      <div class="join">
        <p class="eyebrow">Mississippi · 1869 to 1873</p>
        <h1 class="title">Settling Up</h1>
        <p class="lede">You are Robert, a free farmer four years after the Civil War. For five crop years you will plant, buy on credit, and settle up with the planter who keeps the books. Then you will audit those books.</p>
        ${resume ? `<div class="resume"><p>Pick up where you left off: <strong>the ${esc(resume.family)} family</strong>, ${resume.ending ? "the audit" : CONFIG.years[resume.yearIndex]}.</p><button class="primary" id="resume-btn">Continue</button></div>` : ""}
        <form id="join-form" class="join-form" novalidate>
          <label for="fam-name">Family name</label>
          <input id="fam-name" name="family" maxlength="24" autocomplete="off" placeholder="Whitfield" required ${resume ? "" : "autofocus"}>
          <label for="class-code">Class code <span class="opt">from your teacher, if you have one</span></label>
          <input id="class-code" name="code" maxlength="12" autocomplete="off" placeholder="e.g. P3" style="text-transform:uppercase">
          <p class="form-err" id="join-err" hidden>Type a family name to begin.</p>
          <button class="primary big" type="submit">${resume ? "Start a new family" : "Begin"}</button>
        </form>
        <p class="fine">About 25 minutes. One device per family of 2 or 3 is fine: talk each choice through. <a href="#teacher" id="teacher-link">Teacher board</a></p>
      </div>`);
    $("#teacher-link").addEventListener("click", (e) => { e.preventDefault(); location.hash = "teacher"; Teacher.open(); });
    if (resume) $("#resume-btn").addEventListener("click", () => this.resume(resume));
    $("#join-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const fam = $("#fam-name").value.trim().replace(/\s+/g, " ");

      if (!fam) { $("#join-err").hidden = false; $("#fam-name").focus(); return; }

  },

  start(family, code) {
    this.g = newGame(family, code);
    this.g.step = "prologue";
    this.g.journal = [];
    this.y = null;
    this.corn = new Set();
    Sync.watchClass(code, (c) => this.onClassroom(c));
    this.save();
    this.closeSheet();
    this.run();
  },

  resume(saved) {
    this.g = saved;
    this.y = saved.cur || null;
    this.corn = new Set(saved.cornPlots || []);
    Sync.watchClass(saved.classCode, (c) => this.onClassroom(c));
    this.closeSheet();
    this.run();
  },

  onClassroom(c) {
    this.classroom = c;
    if (this.waiting) this.waiting();
  },

  // ---- the main sequence ----------------------------------------------------
  async run() {
    const g = this.g;
    this.renderTopbar();
    if (g.step === "prologue") {
      await this.cutscene(PROLOGUE);
      g.step = "contract"; this.save();
    }
    if (g.step === "contract") {
      await this.contract();
      g.step = "plant"; this.save();
    }
    while (!g.ending) {
      if (!this.y || this.y.year !== currentYear(g)) {
        this.y = blankYear(g);
        this.corn = new Set();
        this.save();
      }
      await this.playYear();
    }
    if (g.step !== "audit" && g.step !== "done") {
      await this.endingScene();
      g.step = "audit"; this.save();
    }
    if (g.step === "audit") {
      await this.waitForReveal();
      await this.audit();
      g.step = "done"; this.save();
    }
    this.done();
  },

  async playYear() {
    const g = this.g;
    const steps = ["plant", "store", "event", "harvest", "settle"];
    if (!steps.includes(g.step)) g.step = "plant";
    if (g.step === "plant") {
      await this.waitForYear();
      await this.plant();
      g.step = "store"; this.save();
    }
    if (g.step === "store") { await this.storeStep(); g.step = "event"; this.save(); }
    if (g.step === "event") { await this.eventStep(); g.step = "harvest"; this.save(); }
    if (g.step === "harvest") { await this.harvestStep(); g.step = "settle"; this.save(); }
    if (g.step === "settle") {
      const before = g.yearIndex;
      await this.settleStep();
      if (!g.ending) {
        g.step = "plant";
        this.save();
        if (g.yearIndex !== before && INTERLUDES[currentYear(g)]) await this.cutscene(INTERLUDES[currentYear(g)]);
      }
    }
  },

  // ---- class mode gates -------------------------------------------------------
  waitFor(test, html) {
    if (test()) return Promise.resolve();
    return new Promise((resolve) => {
      this.dock("");
      this.sheet(html);
      this.waiting = () => { if (test()) { this.waiting = null; this.closeSheet(); resolve(); } };
    });
  },
  waitForYear() {
    const yr = currentYear(this.g);
    return this.waitFor(
      () => !this.classroom || this.classroom.mode !== "class" || (this.classroom.year || CONFIG.years[0]) >= yr,
      `<div class="wait"><p class="eyebrow">Class mode</p><h2>Waiting for ${yr}</h2><p>Your teacher will start the next crop year for everyone at once. Talk with your family: what will you plant this time?</p></div>`
    );
  },
  waitForReveal() {
    return this.waitFor(
      () => !this.classroom || this.classroom.revealed || !this.classroom.exists,
      `<div class="wait"><p class="eyebrow">The books are closed</p><h2>Waiting for the audit</h2><p>Your teacher will open Mr. ${esc(this.planter())}'s books for every family at once.</p></div>`
    );
  },

  // ---- spring: plant -------------------------------------------------------
  plant() {
    return new Promise((resolve) => {
      const y = this.y;
      World.setSky("spring"); World.setWeather("none"); World.setStage("plan");
      World.setPeople("home"); World.hideWagon();
      World.setFlags({ mule: "planter", school: !!this.g.education });
      World.setCorn(this.corn);
      World.setPlanter(this.planter());
      this.showFlat("plow");
      const line = this.t(YEAR_LINES[y.year].plant);
      this.log(line);
      World.walkTo("field").then(() => {
        World.setMode("plant");
        World.say("mama", "Cotton pays. Corn feeds us. Up to five acres of corn.");
      });
      this.plantDone = () => {
        y.corn = this.corn.size;
        y.cornPlots = [...this.corn];
        this.plantDone = null;
        World.setMode("locked");
        resolve();
      };
      this.renderPlant();
    });
  },
  renderPlant() {
    const y = this.y;
    const corn = this.corn.size;
    const est = plantingEstimate(corn, y.year);
    const prev = CONFIG.years.indexOf(y.year) > 0 ? CONFIG.pricePerBale[y.year - 1] : CONFIG.pricePerBale[y.year];
    const grid = Array.from({ length: CONFIG.acres }, (_, i) => {
      const isCorn = this.corn.has(i);
      return `<button class="acre ${isCorn ? "corn" : "cotton"}" data-acre="${i}" aria-pressed="${isCorn}" aria-label="Acre ${i + 1}: ${isCorn ? "corn" : "cotton"}">${isCorn ? "Corn" : "Cotton"}</button>`;
    }).join("");
    this.dock(`
      <p class="eyebrow">Spring ${y.year} · Plant</p>
      <p class="voice">${esc(this.t(YEAR_LINES[y.year].plant))}</p>
      <p class="how">${World.ok ? "Tap a square in the field, or here, to switch it between cotton and corn." : "Tap a square to switch it between cotton and corn."} Up to ${CONFIG.maxCornAcres} acres of corn.</p>
      <div class="acres" role="group" aria-label="Your 15 acres">${grid}</div>
      <div class="estimate">
        <div><span class="est-k">Cotton</span><span class="est-v">${est.cottonAcres} acres</span><span class="est-s">about ${fmtBales(est.bales)} bales. Your half: ${fmtBales(est.half)}</span></div>
        <div><span class="est-k">Corn</span><span class="est-v">${corn} acres</span><span class="est-s">store bill about ${fmt(est.storeSavings)} lower</span></div>
      </div>
      <p class="fine">Cotton sold for about $${prev} a bale last fall.</p>
      <button class="primary" id="plant-done">Done planting</button>`);
    this.els.dock.querySelectorAll("[data-acre]").forEach((b) => b.addEventListener("click", () => this.togglePlot(+b.dataset.acre)));
    $("#plant-done").addEventListener("click", () => this.plantDone?.());
  },
  togglePlot(i) {
    if (!this.plantDone) return;
    if (this.corn.has(i)) this.corn.delete(i);
    else if (this.corn.size < CONFIG.maxCornAcres) this.corn.add(i);
    else { World.say("mama", "The contract only allows five acres of corn."); this.flashLimit(); return; }
    World.setCorn(this.corn);
    this.renderPlant();
    this.els.dock.querySelector(`[data-acre="${i}"]`)?.focus({ preventScroll: true });
  },
  flashLimit() {
    const el = this.els.dock.querySelector(".how");
    if (!el) return;
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  },

  // ---- event card ------------------------------------------------------------
  async eventStep() {
    const y = this.y, g = this.g;
    const card = CARDS[y.event] || CARDS.none;
    World.setSky("summer");
    World.setStage("grow");
    World.setPeople("home");
    World.walkTo("home");
    this.showFlat(card.art);
    const title = this.t(card.title);
    await new Promise((resolve) => {
      const choice = !!card.question;
      let effect = card.effect;
      if (y.event === "muledies" && g.ownMule) effect = card.effectOwn;
      if (y.event === "sickness" && y.basket === "extra") effect = card.effectExtra;
      if (y.event === "eggs" && y.corn < CONFIG.eggsMinCorn) effect = card.effectNone;
      const muleBlocked = y.event === "mulebuy" && !canBuyMule(g);
      this.log(`${title}. ${this.t(card.body)}`, "card");
      this.sheet(`
        <div class="card">
          <div class="card-art">${cardSVG(card.art, title)}</div>
          <div class="card-text">
            <p class="eyebrow">Summer ${y.year} · Event card</p>
            <h2>${esc(title)}</h2>
            <p>${esc(this.t(card.body))}</p>
            ${choice ? `<p class="q">${esc(this.t(card.question))}</p>` : `<p class="effect">${esc(this.t(effect))}</p>`}
            ${muleBlocked ? `<p class="effect">${esc(card.cantAfford)}</p>` : ""}
            <div class="dyk"><span class="dyk-k">Did you know?</span> ${esc(card.dyk)}${card.credit ? ` <span class="credit">${esc(card.credit)}</span>` : ""}</div>
            <div class="card-actions" id="card-actions">
              ${choice && !muleBlocked
                ? `<button class="primary" data-choice="yes">${esc(this.t(card.yes))}</button><button class="secondary" data-choice="no">${esc(this.t(card.no))}</button>`
                : `<button class="primary" data-choice="ok">Continue</button>`}
            </div>
          </div>
        </div>`, { wide: true });
      this.els.sheetBody.querySelectorAll("[data-choice]").forEach((b) => b.addEventListener("click", () => {
        const c = b.dataset.choice;
        if (c === "ok") { y.choice = muleBlocked ? "no" : null; finish(); return; }
        y.choice = c;
        if (y.event === "mulebuy" && c === "yes") { y.muleBought = CONFIG.muleCost; g.ownMule = true; }
        if (y.event === "school" && c === "yes") g.education += 1;
        const res = this.t(c === "yes" ? card.effectYes : card.effectNo);
        this.log(res, "card");
        $("#card-actions").innerHTML = `<p class="effect">${esc(res)}</p><button class="primary" data-done>Continue</button>`;
        $("#card-actions [data-done]").addEventListener("click", finish);
        $("#card-actions [data-done]").focus();
      }));
      const finish = () => { this.closeSheet(); resolve(); };
    });
    applyEvent(g, y);
    World.setWeather({ rains: "rain", drought: "drought", flood: "flood" }[y.event] || "none");
    if (y.event === "muledies") World.setFlags({ mule: "none" });
    if (y.event === "school") World.setFlags({ school: true });
    if (y.event === "mulebuy" && y.choice === "yes") World.setFlags({ mule: "own" });
    this.save();
    if (World.ok && ["rains", "drought", "flood"].includes(y.event)) {
      this.dock(`<p class="eyebrow">Summer ${y.year}</p><p class="voice">${esc(this.t(card.body))}</p><button class="primary" id="go-on">Go on to the harvest</button>`);
      World.setMode("free");
      await new Promise((r) => $("#go-on").addEventListener("click", r, { once: true }));
      World.setMode("locked");
    }
  },

  // ---- fall: harvest and gin -------------------------------------------------
  async harvestStep() {
    const y = this.y, g = this.g;
    harvest(g, y);
    World.setWeather(y.event === "drought" ? "drought" : "none");
    World.setSky(y.event === "drought" ? "drought" : "fall");
    World.setStage("ripe");
    World.setPeople("field");
    World.say("mama", "Sun's up. Let's get these rows in before the frost.");
    this.showFlat("longRows");
    const line = this.t(YEAR_LINES[y.year].harvest);
    this.log(line);
    await World.walkTo("field");
    await new Promise((resolve) => {
      this.harvestDone = () => { this.harvestDone = null; World.setMode("locked"); resolve(); };
      this.dock(`
        <p class="eyebrow">Fall ${y.year} · Harvest</p>
        <p class="voice">${esc(line)}</p>
        <p class="how">${World.ok ? "Walk the rows with the family. Tap the ground to walk, or use WASD." : "The family worked the rows from September to frost."}</p>
        ${World.ok ? `<div class="progress" aria-hidden="true"><span id="harvest-bar"></span></div>
        <p class="pickcount" id="harvest-pct" aria-live="polite">Rows walked: 0%</p>
        <button class="secondary" id="walk-rows">Walk the rows for me</button>` : ""}
        <button class="primary" id="load-wagon" ${World.ok ? "disabled" : ""}>Load the wagon</button>`);
      World.setMode(World.ok ? "harvest" : "locked");
      $("#walk-rows")?.addEventListener("click", (e) => { e.currentTarget.disabled = true; World.walkRows(); });
      $("#load-wagon").addEventListener("click", () => this.harvestDone?.());
    });
    this.dock(`<p class="eyebrow">Fall ${y.year} · The gin</p><p class="voice">The family picked the rest. It took until frost. The wagon went to Mr. ${esc(this.planter())}'s scale.</p>`);
    const maxLbs = (CONFIG.acres / CONFIG.acresPerBale) * 1.2 * CONFIG.poundsPerBale;
    await World.harvestRun(y.totalBales, y.scaleLbs, maxLbs);
    this.showFlat("porchLantern");
    this.dock(`
      <p class="eyebrow">Fall ${y.year} · The scale</p>
      <div class="scale-read">
        <span class="scale-k">Mr. ${esc(this.planter())}'s scale</span>
        <span class="scale-v">${fmtLbs(y.scaleLbs)}</span>
        <span class="scale-s">${fmtBales(y.scaleLbs / CONFIG.poundsPerBale)} bales. Your ${y.shareRate > 0.5 ? "two-thirds" : "half"}: ${fmtBales(y.creditedBales)} bales. Ginning: $${CONFIG.ginningPerBale} a bale.</span>
      </div>
      <button class="primary" id="to-settle">Go up to the big house</button>`);
    World.say("mama", y.year === 1871 ? "That wagon felt heavier than that." : "That's the year's work, right there.");
    this.log(`Mr. ${this.planter()}'s scale read ${fmtLbs(y.scaleLbs)}.`);
    await new Promise((r) => $("#to-settle").addEventListener("click", r, { once: true }));
  },
  onHarvest(frac) {
    const pct = Math.round(frac * 100);
    const bar = $("#harvest-bar"), label = $("#harvest-pct"), load = $("#load-wagon");
    if (bar) bar.style.width = pct + "%";
    if (label) label.textContent = pct >= 99 ? "Every row is picked." : `Rows walked: ${pct}%`;
    if (load && frac >= 0.6) load.disabled = false;
  },

  onInteract(name) {
    const y = this.y;
    const talk = FAMILY_TALK[name];
    if (talk && y) {
      const line = talk[y.year] || talk.any;
      if (line) {
        World.say(name, this.t(line));
        const who = { mama: "Mama", lucy: "Lucy", sam: "Sam", ruth: "Grandma Ruth", holliday: "Mr. " + this.planter() }[name];
        this.log(who ? `${who}: "${this.t(line)}"` : this.t(line));
      }
    }
  },

  // ---- settling up --------------------------------------------------------------
  async settleStep() {
    const y = this.y, g = this.g;
    World.setSky("dusk");
    World.setStage("picked");
    World.setPeople("porch");
    World.hideWagon();
    this.showFlat("porchLantern");
    this.dock(`<p class="eyebrow">Christmas ${y.year} · Settling up</p><p class="voice">${esc(this.t(YEAR_LINES[y.year].settle))}</p>`);
    this.log(this.t(YEAR_LINES[y.year].settle));
    await World.walkTo("porch");
    World.say("holliday", "Come on up. I've got your number right here.");
    buildLedger(g, y);
    if (!y.evicted && voteEviction(g, y)) { y.evicted = true; y.evictedBy = "vote"; buildLedger(g, y); }
    this.dock("");
    await new Promise((resolve) => {
      this.settleResolve = resolve;
      this.renderSettle(null);
    });
  },
  renderSettle(revealed) {
    const y = this.y, g = this.g;
    const bal = y.ledger.balance;
    const price = CONFIG.pricePerBale[y.year];
    let said;
    if (y.evicted) said = y.evictedBy === "vote" ? SETTLE_TEXT.evictedVote : SETTLE_TEXT.evictedDemand;
    else if (bal < -0.005) said = SETTLE_TEXT.owe.replace("${N}", fmt(-bal));
    else if (bal > 0.005) said = SETTLE_TEXT.ahead.replace("${N}", fmt(bal));
    else said = SETTLE_TEXT.even;
    this.log(`Mr. ${this.planter()}: ${said}`, "settle");
    const rent = !y.evicted && canRent(g, bal);
    const isLast = g.yearIndex >= CONFIG.years.length - 1;
    const revealHtml = revealed ? (() => {
      const r = REVEALS[revealed];
      return `<div class="reveal"><p class="eyebrow">${esc(r.title)}</p><p>${esc(this.t(r.text))}</p><p class="figure-line">${esc(r.detail(y))}</p></div>`;
    })() : "";
    const nextPlanter = PLANTERS[Math.min(g.planterIndex + 1, PLANTERS.length - 1)];
    let actions;
    if (y.evicted) {
      actions = `<button class="primary" data-act="move">${isLast ? "Load the wagon" : `Move to the ${esc(nextPlanter)} place`}</button>
        <p class="fine">Your debt follows you. Mr. ${esc(nextPlanter)} pays it off and puts it on your new account.</p>`;
    } else {
      actions = `
        ${rent ? `<button class="primary" data-act="rent">Rent a farm</button>` : ""}
        <button class="${rent ? "secondary" : "primary"}" data-act="stay">${isLast ? "Stay on" : `Stay and sign for ${y.year + 1}`}</button>
        <button class="secondary" data-act="leave">Leave the ${esc(this.planter())} place</button>
        ${y.demanded ? "" : `<button class="secondary danger" data-act="demand">Demand to see the books</button>`}`;
    }
    this.sheet(`
      <div class="settle">
        <p class="eyebrow">Christmas ${y.year} · ${esc(this.planter())}'s porch</p>
        <p class="sold">He sold the cotton at <strong>$${price}</strong> a bale${y.event === "panic" ? ", after the Panic" : ""}.</p>
        <blockquote class="said">${esc(said)}</blockquote>
        <div class="number ${bal < 0 ? "neg" : ""}" aria-label="Balance ${fmt(bal)}">${fmt(bal)}</div>
        ${revealHtml}
        ${rent ? `<p class="voice">${esc(SETTLE_TEXT.rentReady)}</p>` : ""}
        <div class="settle-actions">${actions}</div>
        ${!y.evicted && bal < 0 ? `<p class="fine">${esc(SETTLE_TEXT.leaveOwing)}</p>` : ""}
        ${!y.evicted && !y.demanded ? `<p class="fine">Demanding the books shows one hidden line. He may put you off the place (1 in 3).</p>` : ""}
      </div>`, { low: true });
    this.els.sheetBody.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => this.settleAct(b.dataset.act)));
  },
  settleAct(act) {
    const y = this.y, g = this.g;
    if (act === "demand") {
      this.log(SETTLE_TEXT.demandIntro, "settle");
      const r = demandBooks(g, y);
      this.save();
      if (r.evicted) World.say("holliday", "Get off my porch.");
      this.renderSettle(r.evicted ? null : r.item);
      return;
    }
    if (act === "leave" && y.ledger.balance < 0 && !this.confirmLeave) {
      this.confirmLeave = true;
      const box = this.els.sheetBody.querySelector(".settle-actions");
      box.innerHTML = `<p class="voice">Mama held Papa's arm. "We owe him ${fmt(-y.ledger.balance)}. If we go owing, the sheriff will come after you."</p>
        <button class="primary" data-act="stay">Stay</button><button class="secondary danger" data-act="leave">Leave anyway</button>`;
      box.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", () => this.settleAct(b.dataset.act)));
      return;
    }
    this.confirmLeave = false;
    const decision = act === "move" ? "stay" : act;
    closeYear(g, y, decision);
    this.log(`Settled ${y.year}: ${fmt(y.ledger.balance)}. ${{ stay: y.evicted ? "We moved to a new place." : "We stayed.", leave: "We left.", rent: "We rented a farm." }[decision]}`, "settle");
    this.closeSheet();
    this.save();
    const done = this.settleResolve;
    this.settleResolve = null;
    done?.();
  },

  // ---- ending and epilogue ---------------------------------------------------
  async endingScene() {
    const g = this.g;
    const e = ENDINGS[g.ending];
    World.setSky("dusk");
    const panels = [...e.panels, g.education ? EPILOGUE.school : EPILOGUE.noschool];

  },

  // ---- the audit -------------------------------------------------------------
  audit() {
    return new Promise((resolve) => {
      const g = this.g;
      const a = auditTotals(g);
      this.dock("");
      World.setMode("locked");
      const ys = g.years.filter(Boolean);
      const row = (label, f, cls = "") => `<tr class="${cls}"><th scope="row">${label}</th>${ys.map((y) => f(y)).join("")}</tr>`;
      const pair = (p, h) => {
        const diff = Math.abs(p - h) > 0.005;
        return `<td><span class="p">${fmt(p)}</span><span class="h ${diff ? "diff" : ""}">${fmt(h)}</span></td>`;
      };
      const table = `
        <div class="ledger-wrap"><table class="ledger">
          <thead><tr><th scope="col"></th>${ys.map((y) => `<th scope="col">${y.year}</th>`).join("")}</tr>
          <tr class="key"><th></th>${ys.map(() => `<th><span class="p">His book</span><span class="h">Honest</span></th>`).join("")}</tr></thead>
          <tbody>
            ${row("Cotton credited", (y) => `<td><span class="p">${fmtBales(y.evicted ? 0 : y.creditedBales)} bales</span><span class="h diff">${fmtBales(y.evicted ? 0 : y.familyBales)} bales</span></td>`)}
            ${row("Your share", (y) => pair(y.ledger.share, y.honest.share))}
            ${row("Store goods", (y) => pair(y.ledger.store, y.honest.store))}
            ${row("Doctor", (y) => pair(y.ledger.doctor, y.honest.doctor))}
            ${row("Mule", (y) => pair(y.ledger.mule + y.muleBought, y.honest.mule + y.muleBought))}
            ${row("Ginning", (y) => pair(y.ledger.ginning, y.honest.ginning))}
            ${row("Interest", (y) => pair(y.ledger.interest, y.honest.interest))}
            ${row("Eggs sold", (y) => pair(y.eggs, y.eggs))}
            ${row("Moving", (y) => pair(y.ledger.leave, y.honest.leave))}
            ${row("Balance", (y) => pair(y.ledger.balance, y.honest.balance), "total")}
          </tbody>
        </table></div>`;
      const qs = [
        { id: "q1", label: "How much did the credit markup cost you over the years you played?", unit: "$", answer: a.markup, tol: Math.max(5, a.markup * 0.05), show: fmt(a.markup) },
        { id: "q2", label: "How much of your cotton went missing at the gin, in pounds?", unit: "lb", answer: a.missingLbs, tol: Math.max(20, a.missingLbs * 0.05), show: `${fmtLbs(a.missingLbs)}, worth ${fmt(a.missingValue)}` },
      ];
      this.sheet(`
        <div class="audit">
          <p class="eyebrow">The audit · ${esc(ENDINGS[g.ending].title)}</p>
          <h2>Open the books</h2>
          <p class="voice">${esc(this.t(AUDIT_INTRO))}</p>
          ${table}
          <p class="fine">Red figures in the honest column are where his book and the truth part ways. Game values, rebuilt from your own play. This is a reconstruction, not a primary source.</p>
          <div class="findings">
            <div class="finding"><span class="f-k">You were told</span><span class="f-v">10% interest</span></div>
            <div class="finding"><span class="f-k">He charged</span><span class="f-v neg">25% interest</span><span class="f-s">${fmt(a.extraInterest)} extra</span></div>
            <div class="finding"><span class="f-k">His final number</span><span class="f-v ${a.finalPlanter < 0 ? "neg" : ""}">${fmt(a.finalPlanter)}</span></div>
            <div class="finding"><span class="f-k">Honest final number</span><span class="f-v ${a.finalHonest < 0 ? "neg" : ""}">${fmt(a.finalHonest)}</span></div>
          </div>
          <h3>Fill in the blanks</h3>
          <form id="audit-form" class="blanks" novalidate>
            ${qs.map((q, i) => `
              <div class="blank" data-q="${q.id}">
                <label for="${q.id}"><span class="qn">${i + 1}</span>${esc(q.label)}</label>
                <div class="blank-row"><span class="unit">${q.unit === "$" ? "$" : ""}</span><input id="${q.id}" inputmode="decimal" autocomplete="off"><span class="unit">${q.unit === "lb" ? "lb" : ""}</span></div>
                <p class="blank-fb" aria-live="polite"></p>
              </div>`).join("")}
            <div class="blank" data-q="q3">
              <fieldset><legend><span class="qn">3</span>Without the hidden charges, would you have reached the $${CONFIG.rentSavings} needed to rent?</legend>
              <div class="yn"><label><input type="radio" name="q3" value="yes"> Yes</label><label><input type="radio" name="q3" value="no"> No</label></div></fieldset>
              <p class="blank-fb" aria-live="polite"></p>
            </div>
            <button class="primary" type="submit">Check my answers</button>
          </form>
          <div id="audit-next" hidden><button class="primary big" id="audit-done">Finish</button></div>
        </div>`, { wide: true });
      let tries = 0;
      $("#audit-form").addEventListener("submit", (e) => {
        e.preventDefault();
        tries++;
        let right = 0;
        qs.forEach((q) => {
          const box = this.els.sheetBody.querySelector(`[data-q="${q.id}"]`);
          const val = parseFloat(String($("#" + q.id).value).replace(/[^0-9.\-]/g, ""));
          const ok = !isNaN(val) && Math.abs(val - q.answer) <= q.tol;
          if (ok) right++;
          box.classList.toggle("right", ok);
          box.querySelector(".blank-fb").textContent = ok ? `Right: ${q.show}.` : tries >= 2 ? `The books say ${q.show}.` : "Not quite. Look for the red figures and add them up.";
        });
        const box3 = this.els.sheetBody.querySelector('[data-q="q3"]');
        const pick = this.els.sheetBody.querySelector('input[name="q3"]:checked')?.value;
        const ok3 = pick === (a.wouldRent ? "yes" : "no");
        if (ok3) right++;
        box3.classList.toggle("right", ok3);
        box3.querySelector(".blank-fb").textContent = ok3 || tries >= 2
          ? `With honest books you would have ended at ${fmt(a.finalHonest)}, so ${a.wouldRent ? "yes, you would have had enough" : "no, not even then"}.`
          : "Not quite. Compare the honest final number with $" + CONFIG.rentSavings + ".";
        g.auditAnswers = { tries, right };
        if (right === 3 || tries >= 2) $("#audit-next").hidden = false;
        this.save();
      });
      $("#audit-done").addEventListener("click", () => { this.closeSheet(); resolve(); });
    });
  },

  done() {
    const g = this.g;
    const a = auditTotals(g);
    World.setMode("free");
    World.setSky("dusk");
    this.dock("");
    this.sheet(`
      <div class="final">
        <p class="eyebrow">The ${esc(g.family)} family · ${esc(ENDINGS[g.ending].title)}</p>
        <h2>${esc(EXIT_TICKET.question)}</h2>
        <p>${esc(EXIT_TICKET.prompt)}</p>
        <p>${esc(EXIT_TICKET.tracker)}</p>
        <div class="report">
          <p class="eyebrow">Report to your teacher</p>
          <p class="report-line"><strong>${esc(g.family)}</strong> · his book ${fmt(a.finalPlanter)} · honest ${fmt(a.finalHonest)} · ${esc(ENDINGS[g.ending].title)}</p>
          <p class="fine">Markup ${fmt(a.markup)} · Cotton missing ${fmtLbs(a.missingLbs)} (${fmt(a.missingValue)}) · Extra interest ${fmt(a.extraInterest)}</p>
        </div>
        <div class="final-actions">
          <button class="secondary" id="final-journal">Read the journal</button>
          <button class="secondary" id="final-new">Play another family</button>
        </div>
      </div>`);
    $("#final-journal").addEventListener("click", () => this.openJournal());
    $("#final-new").addEventListener("click", () => { store.del(SAVE_KEY); location.hash = ""; this.g = null; this.y = null; this.renderTopbar(); this.showJoin(); });
  },

  openJournal() {
    const j = (this.g && this.g.journal) || [];
    const byYear = {};
    j.forEach((e) => { (byYear[e.year] = byYear[e.year] || []).push(e); });
    $("#journal-list").innerHTML = j.length
      ? Object.entries(byYear).map(([yr, es]) => `<section><h3>${yr}</h3>${es.map((e) => `<p class="j-${e.kind}">${esc(e.text)}</p>`).join("")}</section>`).join("")
      : `<p class="fine">Everything you read in the game shows up here, so you can look back at anything you missed.</p>`;
    this.els.journal.hidden = false;
    $("#journal-close").focus();
  },
};

// ============================================================================
// SYNC — family records to the artifact's shared database, when available.
// TEACHER — the class board: live balances, endings, year control, reveal.
// ============================================================================
const slug = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 24) || "x";

const Sync = {
  db: null,
  user: null,
  ready: null,
  live: false,
  writable: true,
  unsubClass: null,
  timer: null,
  writing: false,
  queued: null,

  init() {
    if (this.ready) return this.ready;
    this.ready = (async () => {
      try {
        if (!window.claude || typeof window.claude.use !== "function") return;
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        this.db = db; this.user = user;
        this.live = !!db;
      } catch { this.live = false; }
    })();
    return this.ready;
  },

  async watchClass(code, cb) {
    await this.init();
    this.unsubClass?.();
    this.unsubClass = null;
    if (!this.db || !code) { cb(null); return; }
    try {
      this.unsubClass = this.db.doc("classrooms/" + code).onSnapshot(
        (s) => cb(s.exists ? { ...s.data(), exists: true } : { exists: false }),
        () => cb(null)
      );
    } catch { cb(null); }
  },

  docId(g) {
    if (!g.docId) g.docId = slug(g.classCode) + "--" + slug(g.family) + "-" + Math.random().toString(36).slice(2, 6);
    return g.docId;
  },

  saveFamily(g) {
    if (!g || !g.classCode) return;
    this.docId(g);
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(g), 700);
  },
  async flush(g) {
    await this.init();
    if (!this.db || !this.writable) return;
    const body = { ...familyRecord(g), docId: g.docId, updatedAt: Date.now() };
    if (this.writing) { this.queued = body; return; }
    this.writing = true;
    try {
      await this.db.doc("families/" + g.docId).set(body);
    } catch (e) {
      if (e && (e.code === "invalid_argument" || e.code === "not_granted" || e.code === "revoked")) this.writable = false;
    }
    this.writing = false;
    if (this.queued) { const q = this.queued; this.queued = null; this.writing = true; try { await this.db.doc("families/" + q.docId).set(q); } catch { /* keep playing */ } this.writing = false; }
  },
};

const Teacher = {
  code: "",
  classroom: null,
  families: [],
  unsubs: [],
  canEdit: false,

  async open() {
    const el = $("#teacher");
    el.hidden = false;
    document.body.classList.add("teacher-mode");
    await Sync.init();
    this.canEdit = Sync.user ? await Sync.user.canEdit() : false;
    const last = store.get("settling-up:teacher-code");
    this.code = last || "";
    this.render();
    if (this.code) this.watch();
  },
  close() {
    $("#teacher").hidden = true;
    document.body.classList.remove("teacher-mode");
    this.unsubs.forEach((u) => u());
    this.unsubs = [];
    location.hash = "";
    if (!Game.g) Game.showJoin();
  },

  watch() {
    this.unsubs.forEach((u) => u());
    this.unsubs = [];
    store.set("settling-up:teacher-code", this.code);
    if (!Sync.db || !this.code) { this.render(); return; }
    try {
      this.unsubs.push(Sync.db.doc("classrooms/" + this.code).onSnapshot((s) => {
        this.classroom = s.exists ? s.data() : null;
        this.render();
      }, () => {}));
      this.unsubs.push(Sync.db.collection("families").where("classCode", "==", this.code).onSnapshot((snap) => {
        this.families = snap.docs.map((d) => d.data());
        this.render();
      }, () => {}));
    } catch { this.render(); }
  },

  manualKey() { return "settling-up:manual:" + this.code; },
  manualRows() {
    if (Sync.db && this.classroom && Array.isArray(this.classroom.manual)) return this.classroom.manual;
    return store.get(this.manualKey()) || [];
  },

  async writeClass(patch) {
    const base = this.classroom || { mode: "solo", year: CONFIG.years[0], revealed: false, manual: [] };
    const next = { ...base, ...patch, updatedAt: Date.now() };
    if (Sync.db && this.canEdit) {
      try { await Sync.db.doc("classrooms/" + this.code).set(next); return; } catch { /* fall through */ }
    }
    this.classroom = next;
    if (patch.manual) store.set(this.manualKey(), patch.manual);
    this.render();
  },

  rows() {
    const live = this.families.map((f) => ({
      family: f.family, year: f.year, step: f.step, balance: f.balance, ending: f.ending, live: true, mule: f.ownMule,
    }));
    const manual = this.manualRows().map((m) => ({ ...m, live: false, year: 1873 }));
    return [...live, ...manual];
  },

  chart(rows) {
    if (!rows.length) return `<p class="fine">No families yet. They appear here as they play.</p>`;
    const sorted = [...rows].sort((a, b) => a.balance - b.balance);
    const max = Math.max(CONFIG.rentSavings + 20, ...sorted.map((r) => Math.abs(r.balance)));
    const W = 760, labelW = 150, mid = labelW + (W - labelW) / 2, half = (W - labelW) / 2 - 70;
    const H = sorted.length * 30 + 40;
    const sx = (v) => (v / max) * half;
    let out = `<line x1="${mid}" y1="14" x2="${mid}" y2="${H - 18}" class="axis"/>`;
    const rentX = mid + sx(CONFIG.rentSavings);
    out += `<line x1="${rentX}" y1="14" x2="${rentX}" y2="${H - 18}" class="rentline"/>`;
    out += `<text x="${rentX}" y="${H - 4}" text-anchor="middle" class="ax">$${CONFIG.rentSavings} to rent</text>`;
    out += `<text x="${mid}" y="${H - 4}" text-anchor="middle" class="ax">$0</text>`;
    sorted.forEach((r, i) => {
      const y = 20 + i * 30;
      const w = sx(r.balance);
      const x = w < 0 ? mid + w : mid;
      out += `<text x="${labelW - 10}" y="${y + 14}" text-anchor="end" class="lab">${esc(r.family)}</text>`;
      out += `<rect x="${x}" y="${y}" width="${Math.max(1.5, Math.abs(w))}" height="20" class="bar ${r.balance < 0 ? "neg" : ""}" rx="2"/>`;
      const vx = w < 0 ? x - 6 : x + Math.abs(w) + 6;
      out += `<text x="${vx}" y="${y + 14}" text-anchor="${w < 0 ? "end" : "start"}" class="val">${fmt(r.balance)}</text>`;
    });
    return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" class="board-chart" role="img" aria-label="Final balance for each family">${out}</svg></div>`;
  },

  render() {
    const el = $("#teacher-body");
    const rows = this.rows();
    const finished = rows.filter((r) => r.ending);
    const inDebt = finished.filter((r) => r.balance < 0).length;
    const endings = { cropping: 0, rent: 0, vagrancy: 0 };
    finished.forEach((r) => { if (endings[r.ending] != null) endings[r.ending]++; });
    const c = this.classroom || { mode: "solo", year: CONFIG.years[0], revealed: false };
    const live = Sync.live;
    const status = live
      ? (this.canEdit ? "Live board. Families signed in to claude.ai in your organization report here automatically." : "Live board (read only). Only the artifact's owner or editors can change class settings.")
      : "Not connected to the live board in this view. Add families by hand from their report line.";
    el.innerHTML = `
      <header class="t-head">
        <div><p class="eyebrow">Settling Up</p><h1>Teacher board</h1></div>
        <button class="secondary" id="t-close">Back to the game</button>
      </header>
      <p class="t-status ${live ? "on" : ""}">${esc(status)}</p>
      <form class="t-code" id="t-code">
        <label for="t-code-in">Class code</label>
        <input id="t-code-in" value="${esc(this.code)}" maxlength="12" autocomplete="off" placeholder="e.g. P3" style="text-transform:uppercase">
        <button class="primary" type="submit">Open board</button>
      </form>
      ${this.code ? `
      <section class="t-controls">
        <div class="t-ctl">
          <span class="t-k">Mode</span>
          <div class="seg" role="group" aria-label="Mode">
            <button class="${c.mode !== "class" ? "on" : ""}" data-mode="solo" ${this.canEdit || !live ? "" : "disabled"}>Solo</button>
            <button class="${c.mode === "class" ? "on" : ""}" data-mode="class" ${this.canEdit || !live ? "" : "disabled"}>Class</button>
          </div>
          <span class="t-s">${c.mode === "class" ? "Every family waits for you at the start of each year." : "Families play at their own pace."}</span>
        </div>
        <div class="t-ctl">
          <span class="t-k">Year</span>
          <span class="t-v">${c.mode === "class" ? c.year : "Any"}</span>
          ${c.mode === "class" ? `<button class="secondary" id="t-next" ${c.year >= 1873 ? "disabled" : ""}>Start ${Math.min(1873, (c.year || 1869) + 1)}</button>` : ""}
        </div>
        <div class="t-ctl">
          <span class="t-k">Audit</span>
          <span class="t-v">${c.revealed ? "Open" : "Closed"}</span>
          <button class="${c.revealed ? "secondary" : "primary"}" id="t-reveal">${c.revealed ? "Close the books" : "Open the books for everyone"}</button>
          <span class="t-s">${c.revealed ? "" : "Families who finish wait at the audit until you open it."}</span>
        </div>
      </section>
      <section class="t-board">
        <h2>${finished.length ? `${inDebt} of ${finished.length} families ended in debt` : `${rows.length} ${rows.length === 1 ? "family" : "families"} playing`}</h2>
        <div class="t-endings">
          <span><strong>${endings.cropping}</strong> still cropping</span>
          <span><strong>${endings.rent}</strong> renting a farm</span>
          <span><strong>${endings.vagrancy}</strong> arrested for vagrancy</span>
        </div>
        ${this.chart(rows)}
        <div class="ledger-wrap"><table class="t-table">
          <thead><tr><th>Family</th><th>Year</th><th>Step</th><th>Balance</th><th>Ending</th></tr></thead>
          <tbody>${rows.map((r) => `<tr><td>${esc(r.family)}${r.live ? "" : ' <span class="tag">by hand</span>'}</td><td>${r.year || ""}</td><td>${esc(r.step || (r.ending ? "done" : ""))}</td><td class="${r.balance < 0 ? "neg" : ""}">${fmt(r.balance || 0)}</td><td>${r.ending ? esc(ENDINGS[r.ending]?.title || r.ending) : ""}</td></tr>`).join("") || `<tr><td colspan="5" class="fine">No families yet.</td></tr>`}</tbody>
        </table></div>
      </section>
      <section class="t-manual">
        <h3>Add a family by hand</h3>
        <p class="fine">For families who can't connect: type the line from their final screen.</p>
        <form id="t-add" class="t-add">
          <label for="t-fam">Family</label><input id="t-fam" maxlength="24" required>
          <label for="t-bal">His final number ($)</label><input id="t-bal" inputmode="decimal" required>
          <label for="t-end">Ending</label>
          <select id="t-end"><option value="cropping">Still cropping</option><option value="rent">Renting a farm</option><option value="vagrancy">Arrested for vagrancy</option></select>
          <button class="secondary" type="submit">Add</button>
        </form>
      </section>
      <section class="t-debrief">
        <h3>Debrief prompts</h3>
        <ul>
          <li>How many of you made good choices and still ended in debt?</li>
          <li>Why didn't you just leave? Point to the vagrancy ending and the contract line: nothing is sold until the planter is paid.</li>
          <li>Is this slavery? Push for precision: name what it shares with slavery and what is different.</li>
        </ul>
      </section>` : ""}`;
    $("#t-close").addEventListener("click", () => this.close());
    $("#t-code").addEventListener("submit", (e) => {
      e.preventDefault();
      this.code = $("#t-code-in").value.trim().toUpperCase().replace(/[^A-Z0-9-]/g, "");
      this.classroom = null; this.families = [];
      this.watch();
    });
    if (!this.code) return;
    el.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => this.writeClass({ mode: b.dataset.mode, year: c.year || CONFIG.years[0] })));
    $("#t-next")?.addEventListener("click", () => this.writeClass({ year: Math.min(1873, (c.year || 1869) + 1) }));
    $("#t-reveal").addEventListener("click", () => this.writeClass({ revealed: !c.revealed }));
    $("#t-add").addEventListener("submit", (e) => {
      e.preventDefault();
      const fam = $("#t-fam").value.trim();
      const bal = parseFloat($("#t-bal").value.replace(/[^0-9.\-−]/g, "").replace("−", "-"));
      if (!fam || isNaN(bal)) return;
      const manual = [...this.manualRows(), { family: fam, balance: bal, ending: $("#t-end").value }];
      this.writeClass({ manual });
    });
  },
};

window.SettlingUp = { Game, World, Teacher, auditTotals };
Game.boot();
</script>

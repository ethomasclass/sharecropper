<title>Settling Up</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A sharecropping simulation for U.S. History: five crop years, 1869 to 1873, then an audit of the planter's books.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Caveat:wght@500;700&family=Courier+Prime:wght@400;700&family=Public+Sans:ital,wght@0,400..700;1,400&display=swap">
<style>
/* Layout: a first-person farm fills the screen; paper ledger pages lie on top of it. */
:root {
  color-scheme: light;
  --paper: #EFE6D2;
  --paper-deep: #E3D6B8;
  --ink: #1E1B18;
  --ink-soft: #5A5048;
  --red: #A3271F;
  --ochre: #C08A3E;
  --rule: #A7BAC6;
  --margin: #C9877C;
  --veil: rgba(30, 27, 24, 0.5);
  --display: "Archivo", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Public Sans", "Segoe UI", Arial, sans-serif;
  --figures: "Courier Prime", "Courier New", Courier, monospace;
  --hand: "Caveat", "Segoe Script", "Bradley Hand", cursive;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ochre); outline-offset: 2px; }

#app { position: relative; height: 100%; overflow: hidden; }

/* ---- paper ------------------------------------------------------------ */
.paper {
  background-color: var(--paper);
  background-image:
    linear-gradient(90deg, transparent 0 34px, var(--margin) 34px 35.5px, transparent 35.5px),
    repeating-linear-gradient(to bottom, transparent 0 31px, color-mix(in srgb, var(--rule) 55%, transparent) 31px 32px);
  box-shadow: 0 1px 0 rgba(30,27,24,.08), 0 18px 40px -18px rgba(30,27,24,.55);
}

/* ---- top bar ------------------------------------------------------------ */
#topbar {
  position: absolute; inset: 0 0 auto 0; z-index: 50;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding-block: 8px; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  border-bottom: 1.5px solid var(--ink);
}
.brand { font-family: var(--display); font-stretch: 72%; font-weight: 900; font-size: 1.3rem; letter-spacing: .01em; text-transform: uppercase; margin: 0; }
#years { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; font-family: var(--figures); font-variant-numeric: tabular-nums; }
#years li { display: flex; flex-direction: column; align-items: center; min-width: 52px; padding: 1px 6px; border: 1px solid transparent; line-height: 1.15; }
#years li.cur { border-color: var(--ink); background: var(--paper); }
.chip-yr { font-weight: 700; font-size: .86rem; }
#years li:not(.cur):not(.done) .chip-yr { color: var(--ink-soft); }
.chip-bal { font-size: .72rem; }
.chip-bal.neg { color: var(--red); }
#fam { font-size: .86rem; color: var(--ink-soft); margin-left: auto; min-width: 0; }
.tag { display: inline-block; font-size: .72rem; font-weight: 600; border: 1px solid currentColor; padding: 0 5px; border-radius: 2px; color: var(--ink); }
.topbtn { border: 1.5px solid var(--ink); background: transparent; padding: 4px 12px; font-weight: 600; font-size: .86rem; cursor: pointer; border-radius: 2px; }
.topbtn:hover { background: var(--ink); color: var(--paper); }

/* ---- world -------------------------------------------------------------- */
#world { position: absolute; inset: 0; z-index: 1; }
.world-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#world-flat { position: absolute; inset: 0; background: var(--paper-deep); }
#world-flat svg { width: 100%; height: 100%; display: block; }
.world-tag {
  position: absolute; z-index: 5; pointer-events: none;
  background: var(--paper); border: 1.5px solid var(--ink); padding: 2px 8px;
  font-size: .8rem; font-weight: 600; white-space: nowrap; transform: rotate(-1.5deg);
}
.world-bubble {
  position: absolute; z-index: 6; pointer-events: none; max-width: min(300px, 70vw);
  transform: translate(-50%, calc(-100% - 12px));
  background: var(--paper); border: 1.5px solid var(--ink); padding: 8px 12px;
  font-size: .95rem; line-height: 1.35; box-shadow: 3px 3px 0 var(--ink);
}
.world-bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -9px; width: 14px; height: 14px;
  background: var(--paper); border-right: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink);
  transform: translateX(-50%) rotate(45deg);
}
.world-help {
  position: absolute; z-index: 4; right: var(--gutter-r); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  font-size: .78rem; color: var(--ink); background: color-mix(in srgb, var(--paper) 85%, transparent);
  padding: 4px 10px; border: 1px solid var(--ink); pointer-events: none;
}

/* ---- dock: the small page in the corner --------------------------------- */
#dock {
  position: absolute; z-index: 20;
  left: var(--gutter-l); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(410px, calc(100% - 32px)); max-height: calc(100% - var(--top, 56px) - 32px); overflow: auto;
  padding: 16px 18px 18px 50px; display: flex; flex-direction: column; gap: 10px;
}
#dock > * { margin: 0; }
.eyebrow { font-family: var(--figures); font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin: 0; }
.voice { font-style: italic; margin: 0; }
.how { font-size: .92rem; margin: 0; }
.how.flash { animation: flash .9s; }
@keyframes flash { 0%, 100% { color: var(--ink); } 30% { color: var(--red); } }
.fine { font-size: .82rem; color: var(--ink-soft); margin: 0; }
.fine.warn { color: var(--red); }
.fine a { color: inherit; }

.acres { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.acre {
  aspect-ratio: 1.25; border: 1.5px solid var(--ink); border-radius: 2px; cursor: pointer;
  font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
  background: #F7F2E6; color: var(--ink); padding: 0;
}
.acre.corn { background: var(--ochre); color: var(--ink); }
.estimate { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.estimate > div { display: flex; flex-direction: column; border-top: 1.5px solid var(--ink); padding-top: 4px; min-width: 0; }
.est-k { font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.est-v { font-family: var(--figures); font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.est-s { font-size: .8rem; color: var(--ink-soft); }
.pickcount { font-family: var(--figures); font-weight: 700; margin: 0; }
.progress { height: 10px; border: 1.5px solid var(--ink); background: #F7F2E6; }
.progress span { display: block; height: 100%; width: 0; background: var(--ink); transition: width .3s; }
.scale-read { display: flex; flex-direction: column; border: 1.5px solid var(--ink); padding: 10px 12px; background: #F7F2E6; }
.scale-k { font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.scale-v { font-family: var(--figures); font-weight: 700; font-size: 2rem; font-variant-numeric: tabular-nums; }
.scale-s { font-size: .85rem; }

/* ---- buttons --------------------------------------------------------------- */
.primary, .secondary, .ghost {
  border-radius: 2px; padding: 10px 16px; font-weight: 700; cursor: pointer; min-height: 44px;
  border: 1.5px solid var(--ink); text-align: center;
}
.primary { background: var(--ink); color: var(--paper); }
.primary:hover { background: #3a332d; }
.secondary { background: transparent; color: var(--ink); }
.secondary:hover { background: var(--paper-deep); }
.secondary.danger { color: var(--red); border-color: var(--red); }
.ghost { background: transparent; border-color: transparent; color: inherit; }
.big { font-size: 1.1rem; padding: 12px 22px; }
button:disabled { opacity: .45; cursor: not-allowed; }

/* ---- sheet: a ledger page over the world ----------------------------------- */
#sheet {
  position: absolute; inset: 0; z-index: 40; background: var(--veil);
  display: flex; align-items: center; justify-content: center;
  padding-block: calc(var(--top, 56px) + 10px) 16px; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
}
#sheet.low { align-items: flex-end; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
#sheet.low { background: linear-gradient(to bottom, transparent 0 30%, var(--veil) 75%); }
#sheet.low #sheet-body { max-height: 62%; }
@media (min-width: 900px) {
  #sheet.low { justify-content: flex-end; background: linear-gradient(to right, transparent 0 45%, var(--veil) 100%); }
  #sheet.low #sheet-body { width: min(560px, 100%); max-height: calc(100% - 16px); }
}
#sheet-body {
  width: min(720px, 100%); max-height: 100%; overflow: auto;
  padding: 26px 28px 28px 58px; display: flex; flex-direction: column; gap: 14px;
}
#sheet.wide #sheet-body { width: min(980px, 100%); }
#sheet-body h1, #sheet-body h2, #sheet-body h3 { font-family: var(--display); font-stretch: 78%; text-wrap: balance; margin: 0; line-height: 1.05; }
#sheet-body h2 { font-size: clamp(1.7rem, 4vw, 2.4rem); font-weight: 900; text-transform: uppercase; }
#sheet-body h3 { font-size: 1.15rem; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; }
#sheet-body p { margin: 0; max-width: 68ch; }

.join .title { font-size: clamp(3rem, 11vw, 5.6rem); font-weight: 900; font-stretch: 66%; text-transform: uppercase; letter-spacing: -.01em; line-height: .9; }
.lede { font-size: 1.08rem; }
.join-form { display: grid; gap: 6px; max-width: 360px; }
.join-form label { font-weight: 700; font-size: .9rem; margin-top: 6px; }
.join-form .opt { font-weight: 400; color: var(--ink-soft); }
.join-form input, .t-code input, .t-add input, .t-add select, .blank input {
  border: none; border-bottom: 2px solid var(--ink); background: transparent; padding: 6px 2px;
  font-family: var(--figures); font-size: 1.15rem; border-radius: 0; min-width: 0;
}
.join-form button { margin-top: 12px; justify-self: start; }
.form-err { color: var(--red); font-weight: 600; }
.resume { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; border: 1.5px solid var(--ink); padding: 10px 14px; background: #F7F2E6; }
.wait { display: flex; flex-direction: column; gap: 10px; padding-block: 12px; }

/* contract */
.contract { background: #F7F2E6; border: 1.5px solid var(--ink); padding: 16px 18px; font-family: Georgia, "Times New Roman", serif; display: flex; flex-direction: column; gap: 10px; }
.doc-label { font-family: var(--display); font-stretch: 70%; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; text-align: center; }
.doc-credit { font-family: var(--body); font-size: .76rem; color: var(--ink-soft); }
.terms { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
.terms dt { font-weight: 700; }
.terms dd { margin: 0; font-family: var(--figures); }
.game-note { font-size: .82rem; color: var(--ink-soft); }
.mark-row { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.mark { position: relative; width: min(360px, 100%); height: 92px; border: none; background: transparent; cursor: pointer; padding: 0; }
.mark-line { position: absolute; left: 0; right: 0; bottom: 26px; border-bottom: 2px solid var(--ink); }
.mark-x { position: absolute; left: 40%; bottom: 22px; font-family: var(--hand); font-size: 4.4rem; line-height: 1; color: var(--red); opacity: 0; transform: scale(1.8) rotate(-8deg); transition: opacity .25s, transform .35s cubic-bezier(.2,1.4,.4,1); }
.mark.made .mark-x { opacity: 1; transform: scale(1) rotate(-8deg); }
.mark-cap { position: absolute; left: 0; bottom: 2px; font-size: .78rem; color: var(--ink-soft); }
.mark:hover .mark-line { border-bottom-color: var(--red); }
.hint-small { font-size: .82rem; color: var(--ink-soft); }

/* store */
.baskets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.basket {
  display: flex; flex-direction: column; gap: 6px; text-align: left; cursor: pointer;
  background: #F7F2E6; border: 1.5px solid var(--ink); border-radius: 2px; padding: 14px 14px 12px;
}
.basket:hover { box-shadow: 4px 4px 0 var(--ink); transform: translate(-2px, -2px); }
.basket-name { font-family: var(--display); font-stretch: 75%; font-weight: 900; font-size: 1.4rem; text-transform: uppercase; }
.basket-note { font-size: .86rem; color: var(--ink-soft); }
.hand { list-style: none; margin: 0; padding: 0; font-family: var(--hand); font-size: 1.35rem; line-height: 1.15; color: #2B3550; }
.basket-price { margin-top: auto; display: flex; justify-content: space-between; align-items: baseline; border-top: 1.5px solid var(--ink); padding-top: 6px; font-family: var(--figures); font-weight: 700; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.basket-price .lbl { font-family: var(--body); font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }

/* event card */
.card { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; align-items: start; }
.card-art { border: 1.5px solid var(--ink); aspect-ratio: 16 / 10; overflow: hidden; max-width: 100%; background: var(--paper-deep); }
.card-art svg { width: 100%; height: 100%; display: block; }
.card-text { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.q { font-weight: 700; font-size: 1.1rem; }
.effect { font-family: var(--figures); font-weight: 700; border-left: 4px solid var(--red); padding-left: 10px; }
.dyk { font-size: .9rem; background: #F7F2E6; border: 1px dashed var(--ink-soft); padding: 10px 12px; }
.dyk-k { font-weight: 800; text-transform: uppercase; font-size: .74rem; letter-spacing: .06em; display: block; margin-bottom: 2px; }
.credit { display: block; margin-top: 4px; font-size: .76rem; color: var(--ink-soft); }
.card-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* settling up */
.settle { display: flex; flex-direction: column; gap: 12px; }
.sold { font-size: 1rem; }
.said { margin: 0; font-size: 1.25rem; font-style: italic; border-left: 3px solid var(--ink); padding-left: 14px; max-width: 60ch; }
.number {
  font-family: var(--figures); font-weight: 700; font-size: clamp(2.8rem, 9vw, 4.6rem); line-height: 1;
  font-variant-numeric: tabular-nums; align-self: flex-start; padding-bottom: 6px; border-bottom: 5px double currentColor;
}
.number.neg { color: var(--red); }
.reveal { border: 1.5px solid var(--red); padding: 12px 14px; background: #F7F2E6; display: flex; flex-direction: column; gap: 6px; }
.figure-line { font-family: var(--figures); font-weight: 700; }
.settle-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* audit */
.ledger-wrap { overflow-x: auto; border: 1.5px solid var(--ink); background: #F7F2E6; max-width: 100%; }
.ledger { border-collapse: collapse; width: 100%; font-family: var(--figures); font-variant-numeric: tabular-nums; font-size: .86rem; }
.ledger th, .ledger td { padding: 6px 10px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; vertical-align: top; }
.ledger thead th { font-weight: 700; border-bottom: 1.5px solid var(--ink); }
.ledger tbody th { text-align: left; font-family: var(--body); font-weight: 600; font-size: .84rem; }
.ledger .p, .ledger .h { display: block; }
.ledger .h { color: var(--ink-soft); }
.ledger .h.diff { color: var(--red); font-weight: 700; }
.ledger tr.key th { font-family: var(--body); font-size: .68rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); font-weight: 600; }
.ledger tr.total td, .ledger tr.total th { border-top: 1.5px solid var(--ink); border-bottom: 4px double var(--ink); font-weight: 700; }
.findings { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.finding { display: flex; flex-direction: column; border-top: 1.5px solid var(--ink); padding-top: 4px; min-width: 0; }
.f-k { font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.f-v { font-family: var(--figures); font-weight: 700; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.f-v.neg { color: var(--red); }
.f-s { font-size: .8rem; color: var(--red); font-family: var(--figures); }
.blanks { display: flex; flex-direction: column; gap: 14px; }
.blank { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border: 1.5px solid var(--ink); background: #F7F2E6; }
.blank.right { border-color: var(--ink); box-shadow: inset 4px 0 0 var(--ink); }
.blank label, .blank legend { font-weight: 600; }
.blank fieldset { border: none; margin: 0; padding: 0; }
.qn { display: inline-grid; place-items: center; width: 1.5em; height: 1.5em; border: 1.5px solid var(--ink); border-radius: 50%; font-family: var(--figures); font-weight: 700; font-size: .8rem; margin-right: 8px; }
.blank-row { display: flex; align-items: baseline; gap: 4px; max-width: 240px; }
.blank-row input { flex: 1; }
.unit { font-family: var(--figures); font-weight: 700; }
.blank-fb { font-size: .88rem; min-height: 1.2em; }
.yn { display: flex; gap: 20px; margin-top: 6px; }
.yn label { display: flex; gap: 6px; align-items: center; font-weight: 600; }
.blanks > button { align-self: flex-start; }

/* final */
.final { display: flex; flex-direction: column; gap: 12px; }
.report { border: 1.5px solid var(--ink); padding: 12px 14px; background: #F7F2E6; display: flex; flex-direction: column; gap: 4px; }
.report-line { font-family: var(--figures); font-size: 1.05rem; }
.final-actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* ---- cutscene ------------------------------------------------------------ */
#cutscene {
  position: absolute; inset: 0; z-index: 60; background: var(--ink); color: var(--paper);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  padding-block: 20px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); cursor: pointer;
}
.cut-frame { width: min(100%, calc((100vh - 230px) * 16 / 9), 1100px); max-width: 100%; }
.cut-art { aspect-ratio: 16 / 9; max-width: 100%; border: 6px solid var(--paper); overflow: hidden; background: var(--paper-deep); }
.cut-art svg { width: 100%; height: 100%; display: block; animation: drift 9s ease-out both; }
@keyframes drift { from { transform: scale(1.06) translateY(1%); } to { transform: scale(1); } }
.cut-text { width: min(100%, 1100px); display: flex; flex-direction: column; gap: 4px; }
.cut-cap { font-family: var(--display); font-stretch: 80%; font-weight: 800; font-size: clamp(1.3rem, 3vw, 2rem); line-height: 1.15; margin: 0; text-wrap: balance; }
.cut-sub { font-size: clamp(1rem, 2vw, 1.2rem); margin: 0; color: #DCCFB2; }
.cut-nav { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.cut-count { font-family: var(--figures); font-size: .85rem; color: #BDAF92; margin-right: auto; }
#cutscene .primary { background: var(--paper); color: var(--ink); border-color: var(--paper); }
#cutscene .ghost { color: #DCCFB2; }

/* ---- journal ------------------------------------------------------------- */
#journal {
  position: absolute; z-index: 70; top: 0; right: 0; bottom: 0; width: min(440px, 100%);
  display: flex; flex-direction: column; border-left: 1.5px solid var(--ink);
  padding-top: env(safe-area-inset-top, 0px);
}
.j-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 10px 50px; border-bottom: 1.5px solid var(--ink); }
.j-head h2 { font-family: var(--display); font-stretch: 75%; font-weight: 900; text-transform: uppercase; margin: 0; font-size: 1.5rem; }
#journal-list { overflow: auto; padding: 14px 18px 24px 50px; padding-right: var(--gutter-r); display: flex; flex-direction: column; gap: 14px; }
#journal-list section { display: flex; flex-direction: column; gap: 8px; }
#journal-list h3 { font-family: var(--figures); margin: 0; font-size: 1rem; }
#journal-list p { margin: 0; font-size: .95rem; }
.j-card { font-weight: 600; }
.j-settle { font-family: var(--figures); font-size: .9rem !important; }
.j-cutscene { font-style: italic; }

/* ---- teacher ------------------------------------------------------------- */
#teacher { position: absolute; inset: 0; z-index: 80; overflow: auto; }
#teacher-body { max-width: 1000px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(52px, env(safe-area-inset-left, 0px)); padding-right: var(--gutter-r); display: flex; flex-direction: column; gap: 18px; }
#teacher-body h1 { font-family: var(--display); font-stretch: 70%; font-weight: 900; text-transform: uppercase; font-size: clamp(2rem, 6vw, 3rem); margin: 0; line-height: 1; }
#teacher-body h2 { font-family: var(--display); font-stretch: 78%; font-weight: 900; font-size: clamp(1.4rem, 4vw, 2rem); margin: 0; text-wrap: balance; }
#teacher-body h3 { font-family: var(--display); font-stretch: 78%; font-weight: 800; text-transform: uppercase; margin: 0; }
.t-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.t-status { margin: 0; font-size: .9rem; border-left: 4px solid var(--ink-soft); padding-left: 10px; max-width: 70ch; }
.t-status.on { border-color: var(--ink); }
.t-code, .t-add { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end; }
.t-code label, .t-add label { font-weight: 700; font-size: .85rem; width: 100%; margin-bottom: -6px; }
.t-add label { width: auto; margin: 0; }
.t-controls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

<script type="module">
// ============================================================================
// TUNING — every game number lives here. Change prices and odds without
// touching game logic. All dollar amounts are game values, not history.
// ============================================================================
const CONFIG = {
  years: [1869, 1870, 1871, 1872, 1873],

  // The deal
  acres: 15,
  maxCornAcres: 5,          // contract caps the food patch
  acresPerBale: 3,          // about 1 bale per 3 acres of cotton
  familyShare: 0.5,         // half the crop
  muleOwnerShare: 2 / 3,    // a family with its own mule keeps two-thirds (planter takes a third)
  poundsPerBale: 400,

  // Cotton price per bale, announced each year
  pricePerBale: { 1869: 110, 1870: 95, 1871: 85, 1872: 85, 1873: 60 },

  // Store (furnish). Students only ever see credit prices.
  creditMarkup: 0.40,       // hidden: credit price = cash price x 1.40
  baskets: {
    lean:  { label: "Lean",  credit: 170, note: "Cut the cloth and shoes." },
    basic: { label: "Basic", credit: 210, note: "Food, cloth, shoes, and supplies." },
    extra: { label: "Extra", credit: 245, note: "Basic, plus medicine and coffee." },
  },
  cornSavingsCash: 12,      // each acre of corn cuts the store bill (cash price)

  ginningPerBale: 5,        // charged on the family's half
  shortWeight: 0.10,        // hidden: 10% of the family's cotton goes missing at the gin
  interestTold: 0.10,       // what the planter says
  interestCharged: 0.25,    // what the ledger actually charges on carried debt

  // Events
  doctorCredit: 10,
  muleCost: 60,
  eggsCash: 15,
  eggsMinCorn: 3,
  leaveCost: 10,            // moving costs; doubled after the night riders card
  evictOddsDemand: 1 / 3,   // demanding the books
  evictOddsVote: 1 / 4,     // voting

  leanSickOdds: 0.4,       // a lean basket in a bad year: chance someone falls sick

  // The ladder out
  rentSavings: 150,         // plus owning a mule
};

// The event deck. Weights set how often each card is drawn.
// 1873 is always the Panic. Election only in 1870 or 1872.
const DECK = [
  { id: "rains",    weight: 2.5 },
  { id: "drought",  weight: 1.2, bad: true },
  { id: "flood",    weight: 1.0, bad: true },
  { id: "muledies", weight: 0.8, bad: true },
  { id: "sickness", weight: 1.2, bad: true },
  { id: "school",   weight: 1.5 },
  { id: "election", weight: 2.0, years: [1870, 1872] },
  { id: "mulebuy",  weight: 3.5, years: [1870, 1871, 1872] },
  { id: "eggs",     weight: 2.0 },
  { id: "riders",   weight: 1.0, bad: true },
];

// ============================================================================
// ENGINE — pure game rules. No DOM in here, so it can be tested on its own.
// ============================================================================

// Seeded draws: every roll is keyed, so a refresh never rerolls a year.
function hashString(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}
function roll(seed, key) {
  let t = (hashString(seed + "|" + key) + 0x6d2b79f5) >>> 0;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function familySeed(family, classCode) {
  return (family || "").trim().toLowerCase() + "::" + (classCode || "").trim().toUpperCase();
}

const money = (n) => Math.round(n * 100) / 100;
const cashOf = (credit) => credit / (1 + CONFIG.creditMarkup);

// One card per year, without repeats. 1873 is always the Panic.
function drawEvents(seed) {
  const used = new Set();
  return CONFIG.years.map((year) => {
    if (year === 1873) return "panic";
    const pool = DECK.filter((c) => !used.has(c.id) && (!c.years || c.years.includes(year)));
    const total = pool.reduce((s, c) => s + c.weight, 0);
    let r = roll(seed, "event:" + year) * total;
    let pick = pool[pool.length - 1];
    for (const c of pool) {
      r -= c.weight;
      if (r < 0) { pick = c; break; }
    }
    used.add(pick.id);
    return pick.id;
  });
}

function isBadCard(id) {
  if (id === "panic") return true;
  const c = DECK.find((d) => d.id === id);
  return !!(c && c.bad);
}

function newGame(family, classCode) {
  const seed = familySeed(family, classCode);
  return {
    v: 1,
    family: family.trim(),
    classCode: (classCode || "").trim().toUpperCase(),
    seed,
    events: drawEvents(seed),
    yearIndex: 0,
    step: "contract",
    balance: 0,          // the planter's books: + savings, - debt
    honestBalance: 0,    // same family, same choices, no hidden charges
    ownMule: false,
    education: 0,
    planterIndex: 0,     // 0 = Holliday; moves to the next planter on leaving or eviction
    revealed: [],        // hidden line items the family has forced into the open
    years: [],
    ending: null,
    signed: false,
  };
}

function currentYear(g) { return CONFIG.years[g.yearIndex]; }

function blankYear(g) {
  return {
    year: currentYear(g),
    corn: 0,
    basket: "basic",
    event: g.events[g.yearIndex],
    choice: null,        // event choice: "yes" | "no"
    cornLost: false,
    yieldNotes: [],
    doctor: 0,
    muleCharge: 0,
    eggs: 0,
    muleBought: 0,
    leaveCost: 0,
    voted: false,
    evicted: false,
    evictedBy: null,
    demanded: false,
    decision: null,      // "stay" | "leave" | "rent"
    startBalance: g.balance,
    startHonest: g.honestBalance,
  };
}

// Planting preview: what the family is told (no short weight).
function plantingEstimate(corn, year) {
  const cottonAcres = CONFIG.acres - corn;
  const bales = cottonAcres / CONFIG.acresPerBale;
  const half = bales * CONFIG.familyShare;
  const price = CONFIG.pricePerBale[year];
  return {
    cottonAcres,
    bales,
    half,
    shareValue: half * price,
    storeSavings: corn * CONFIG.cornSavingsCash * (1 + CONFIG.creditMarkup),
  };
}

// Apply the drawn card and any choice the family made on it.
function applyEvent(g, y) {
  const notes = [];
  let mult = 1;
  const id = y.event;
  y.doctor = 0; y.muleCharge = 0; y.eggs = 0; y.cornLost = false;
  switch (id) {
    case "rains": mult *= 1.2; notes.push(["Good rains", 1.2]); break;
    case "drought": mult *= 0.7; notes.push(["Drought", 0.7]); break;
    case "flood": mult *= 0.8; y.cornLost = true; notes.push(["Flood", 0.8]); break;
    case "muledies":
      if (g.ownMule) y.lostOwnMule = true;
      else y.muleCharge = CONFIG.muleCost;
      break;
    case "sickness":
      if (y.basket === "extra") { mult *= 0.9; notes.push(["Sickness (medicine on hand)", 0.9]); }
      else { mult *= 0.85; y.doctor += CONFIG.doctorCredit; notes.push(["Sickness", 0.85]); }
      break;
    case "school":
      if (y.choice === "yes") { mult *= 0.9; notes.push(["A child in school", 0.9]); }
      break;
    case "election":
      y.voted = y.choice === "yes";
      break;
    case "eggs":
      if (y.corn >= CONFIG.eggsMinCorn) y.eggs = CONFIG.eggsCash;
      break;
    default: break;
  }
  // A lean basket leaves the family thin when a bad year comes.
  if (y.basket === "lean" && isBadCard(id) && roll(g.seed, "lean:" + y.year) < CONFIG.leanSickOdds) {
    mult *= 0.85;
    y.doctor += CONFIG.doctorCredit;
    notes.push(["Thin winter, sickness", 0.85]);
  }
  y.yieldMult = mult;
  y.yieldNotes = notes;
}

// Mule purchase happens on the card, in cash, if the family has it.
function canBuyMule(g) { return g.balance >= CONFIG.muleCost && !g.ownMule; }

// Harvest and gin. Returns the numbers the planter shows and the true ones.
function harvest(g, y) {
  const cottonAcres = CONFIG.acres - y.corn;
  const bales = (cottonAcres / CONFIG.acresPerBale) * y.yieldMult;
  y.shareRate = g.ownMule ? CONFIG.muleOwnerShare : CONFIG.familyShare;
  const half = bales * y.shareRate;
  const credited = half * (1 - CONFIG.shortWeight);
  y.totalBales = bales;
  y.familyBales = half;
  y.creditedBales = credited;
  y.trueLbs = Math.round(bales * CONFIG.poundsPerBale);
  y.scaleLbs = Math.round(bales * (1 - CONFIG.shortWeight) * CONFIG.poundsPerBale);
  return y;
}

// Build both ledgers for the year. `evicted` zeroes the family's share.
function buildLedger(g, y) {
  const price = CONFIG.pricePerBale[y.year];
  const cornSavingsCash = y.cornLost ? 0 : y.corn * CONFIG.cornSavingsCash;
  const basketCredit = CONFIG.baskets[y.basket].credit;
  const storeCredit = basketCredit - cornSavingsCash * (1 + CONFIG.creditMarkup);
  const storeCash = cashOf(basketCredit) - cornSavingsCash;
  const ginning = y.familyBales * CONFIG.ginningPerBale;

  const carried = y.startBalance - y.muleBought + y.eggs;
  const honestCarried = y.startHonest - y.muleBought + y.eggs;
  const interest = y.startBalance < 0 ? -y.startBalance * CONFIG.interestCharged : 0;
  const honestInterest = y.startHonest < 0 ? -y.startHonest * CONFIG.interestTold : 0;

  const share = y.evicted ? 0 : y.creditedBales * price;
  const honestShare = y.evicted ? 0 : y.familyBales * price;

  const planter = {
    price,
    share,
    store: storeCredit,
    doctor: y.doctor,
    mule: y.muleCharge,
    ginning,
    interest,
    leave: y.leaveCost,
  };
  planter.charges = planter.store + planter.doctor + planter.mule + planter.ginning + planter.interest + planter.leave;
  planter.balance = money(carried + planter.share - planter.charges);

  const honest = {
    price,
    share: honestShare,
    store: storeCash,
    doctor: cashOf(y.doctor),
    mule: y.muleCharge,
    ginning,
    interest: honestInterest,
    leave: y.leaveCost,
  };
  honest.charges = honest.store + honest.doctor + honest.mule + honest.ginning + honest.interest + honest.leave;
  honest.balance = money(honestCarried + honest.share - honest.charges);

  y.ledger = planter;
  y.honest = honest;
  y.markup = (storeCredit - storeCash) + (y.doctor - cashOf(y.doctor));
  y.missingBales = y.familyBales - y.creditedBales;
  y.missingValue = y.evicted ? 0 : y.missingBales * price;
  y.extraInterest = interest - (y.startBalance < 0 ? -y.startBalance * CONFIG.interestTold : 0);
  return y;
}

function leaveCostFor(y) {
  return CONFIG.leaveCost * (y.event === "riders" ? 2 : 1);
}

// Settling up. Recompute after anything that changes the year.
function settleNumbers(g, y) {
  buildLedger(g, y);
  return y.ledger.balance;
}

// The vote can cost the family its place. Rolled once, at settling up.
function voteEviction(g, y) {
  return y.voted && roll(g.seed, "vote:" + y.year) < CONFIG.evictOddsVote;
}

const HIDDEN_ITEMS = ["markup", "weight", "interest"];

// Demanding the books: 1 in 3 the planter puts the family off the place.
function demandBooks(g, y) {
  y.demanded = true;
  if (roll(g.seed, "demand:" + y.year) < CONFIG.evictOddsDemand) {
    y.evicted = true;
    y.evictedBy = "demand";
    buildLedger(g, y);
    return { evicted: true };
  }
  const next = HIDDEN_ITEMS.find((k) => !g.revealed.includes(k)) || HIDDEN_ITEMS[0];
  if (!g.revealed.includes(next)) g.revealed.push(next);
  return { evicted: false, item: next };
}

function canRent(g, balance) { return balance >= CONFIG.rentSavings && g.ownMule; }

// Close the year with the family's decision and move on.
function closeYear(g, y, decision) {
  y.decision = decision;
  buildLedger(g, y);
  const owed = y.ledger.balance < 0;
  if (decision === "leave" && !y.evicted && !owed) {
    y.leaveCost = leaveCostFor(y);
    buildLedger(g, y);
  }
  g.balance = y.ledger.balance;
  g.honestBalance = y.honest.balance;
  if (y.lostOwnMule) g.ownMule = false;
  g.years[g.yearIndex] = y;

  if (decision === "rent") { g.ending = "rent"; return g; }
  if (decision === "leave" && owed && !y.evicted) { g.ending = "vagrancy"; return g; }
  if (decision === "leave" || y.evicted) g.planterIndex += 1;
  if (g.yearIndex >= CONFIG.years.length - 1) { g.ending = "cropping"; return g; }
  g.yearIndex += 1;
  return g;
}

// Totals for the audit, from the family's own play.
function auditTotals(g) {
  const ys = g.years.filter(Boolean);
  const markup = ys.reduce((s, y) => s + y.markup, 0);
  const missingBales = ys.reduce((s, y) => s + (y.evicted ? 0 : y.missingBales), 0);
  const missingValue = ys.reduce((s, y) => s + y.missingValue, 0);
  const extraInterest = ys.reduce((s, y) => s + y.extraInterest, 0);
  const finalPlanter = ys.length ? ys[ys.length - 1].ledger.balance : 0;
  const finalHonest = ys.length ? ys[ys.length - 1].honest.balance : 0;
  return {
    markup: money(markup),
    missingBales,
    missingLbs: Math.round(missingBales * CONFIG.poundsPerBale),
    missingValue: money(missingValue),
    extraInterest: money(extraInterest),
    finalPlanter,
    finalHonest,
    wouldRent: finalHonest >= CONFIG.rentSavings,
  };
}

// One compact record per family, for the class board and the audit.
function familyRecord(g) {
  return {
    family: g.family,
    classCode: g.classCode,
    year: currentYear(g),
    step: g.step,
    balance: g.balance,
    ownMule: g.ownMule,
    education: g.education,
    ending: g.ending,
    years: g.years.filter(Boolean).map((y) => ({
      year: y.year,
      corn: y.corn,
      basket: y.basket,
      event: y.event,
      choice: y.choice,
      bales: Math.round(y.totalBales * 100) / 100,
      shortLbs: y.trueLbs - y.scaleLbs,
      credited: money(y.ledger.share),
      charges: money(y.ledger.charges),
      decision: y.decision,
      evicted: y.evicted,
      balance: y.ledger.balance,
    })),
    audit: g.ending ? auditTotals(g) : null,
  };
}

// ============================================================================
// STORY — every word students read. Lucy tells it, looking back.
// {F} = the family name students type. {P} = the current planter.
// ============================================================================
const PLANTERS = ["Holliday", "Pruitt", "Dunbar", "Coker", "Askew"];

const FAMILY = [
  { id: "papa", name: "Papa", full: "Robert", role: "Plows and picks" },
  { id: "mama", name: "Mama", full: "Hannah", role: "Keeps count" },
  { id: "lucy", name: "Lucy", full: "Lucy, 10", role: "Tells this story" },
  { id: "sam", name: "Sam", full: "Sam, 6", role: "Carries water" },
  { id: "ruth", name: "Grandma Ruth", full: "Ruth", role: "Minds the garden" },
];

const PROLOGUE = [
  { art: "fieldSun", caption: "Mississippi, 1869. Four years after freedom came.", sub: "My name is Lucy {F}. I was ten years old." },
  { art: "family", caption: "There were five of us.", sub: "Papa, Mama, Grandma Ruth, my little brother Sam, and me." },
  { art: "plow", caption: "Papa wanted one thing: land of our own.", sub: "People had talked about forty acres. It never came." },
  { art: "bigHouse", caption: "Mr. Holliday had land but no one to work it.", sub: "We had our hands, and nothing else." },
  { art: "contractDesk", caption: "So in January, Papa walked up to the big house.", sub: "He went to make his mark on a contract." },
];

// Adapted from the 1882 Grimes contract (SHEG modified version).
const CONTRACT = {
  lines: [
    "For every 30 acres of land rented by sharecroppers, I will provide a mule team, plow, and farming tools. The sharecroppers can have half of the cotton, corn, peas, pumpkins, and potatoes they grow.",

    "Nothing can be sold from their crops until my rent is all paid, and all amounts they owe me are paid in full.",
    "I am to gin and pack all of the cotton.",
    "The sale of every sharecropper's part of the cotton to be made by me when and where I choose to sell, and after taking all they owe me.",
  ],
  credit: "Adapted. Sharecropping contract, 1882, Grimes Family Papers (#3357), Southern Historical Collection, UNC Chapel Hill. Modified by the Stanford History Education Group.",
  terms: [

    ["Your share", "Half the cotton, after he is paid"],

    ["Interest", "10% on anything carried to next year"],

const STORE_ITEMS = {

// ART — flat 2D cutscene panels and card art, built from simple shapes.
// Palette leans on tempera colors: ochre, indigo, brick, ink, and paper.
// ============================================================================
const ART_COLORS = {
  paper: "#EFE6D2", paper2: "#E2D4B6", ink: "#1E1B18", ochre: "#C08A3E", ochreLt: "#D9AE62",
  brick: "#A3271F", indigo: "#2E3B56", indigoLt: "#4C5C7E", green: "#5E6A3A", greenLt: "#7E8B4E",
  brown: "#7A4A2E", brownDk: "#4F2F1D", cream: "#F6EFDF", sky: "#D9B877", night: "#1F2840",
  skin1: "#5A3824", skin2: "#7A4E30", skin3: "#3E2718", cotton: "#F7F2E6", gray: "#8C8578",
};
const AC = ART_COLORS;

function svgWrap(w, h, inner, label) {
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${label || ""}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}
const R = (x, y, w, h, f, extra = "") => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${extra}/>`;
const C = (x, y, r, f, extra = "") => `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${extra}/>`;
const P = (pts, f, extra = "") => `<polygon points="${pts.map((p) => p.join(",")).join(" ")}" fill="${f}" ${extra}/>`;
const L = (x1, y1, x2, y2, s, w, extra = "") => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${s}" stroke-width="${w}" ${extra}/>`;
const T = (x, y, txt, o = {}) => `<text x="${x}" y="${y}" fill="${o.fill || AC.ink}" font-family="${o.font || "Archivo, 'Arial Narrow', sans-serif"}" font-size="${o.size || 40}" font-weight="${o.weight || 800}" text-anchor="${o.anchor || "middle"}" letter-spacing="${o.ls || 0}" ${o.extra || ""}>${txt}</text>`;

// A flat, faceless figure. (x, y) is where the feet meet the ground.
function figure(x, y, h, o = {}) {
  const s = h / 100;
  const skin = o.skin || AC.skin1, top = o.top || AC.indigo, low = o.low || AC.brownDk;
  const dir = o.dir === "left" ? -1 : 1;
  const X = (dx) => x + dx * s * dir;
  const Y = (dy) => y - dy * s;
  let out = "";
  // legs or skirt
  if (o.skirt) {
    out += P([[X(-9), Y(52)], [X(9), Y(52)], [X(19), Y(3)], [X(-17), Y(3)]], low);
    out += R(X(-10) - (dir < 0 ? 5 * s : 0), Y(4), 6 * s, 4 * s, AC.ink);
  } else {
    out += P([[X(-9), Y(52)], [X(-1), Y(52)], [X(-3), Y(0)], [X(-11), Y(0)]], low);
    out += P([[X(1), Y(52)], [X(9), Y(52)], [X(11), Y(0)], [X(3), Y(0)]], low);
  }
  // torso
  out += P([[X(-13), Y(83)], [X(13), Y(83)], [X(10), Y(50)], [X(-10), Y(50)]], top);
  // arms
  const pose = o.pose || "down";
  if (pose === "down") {
    out += P([[X(-13), Y(82)], [X(-8), Y(80)], [X(-12), Y(48)], [X(-17), Y(49)]], top);
    out += P([[X(13), Y(82)], [X(8), Y(80)], [X(12), Y(48)], [X(17), Y(49)]], top);
    out += C(X(-14.5), Y(46), 3.4 * s, skin) + C(X(14.5), Y(46), 3.4 * s, skin);
  } else if (pose === "work") {
    // bent forward, both arms reaching low
    out += P([[X(8), Y(82)], [X(13), Y(80)], [X(30), Y(52)], [X(25), Y(49)]], top);
    out += P([[X(-6), Y(80)], [X(-1), Y(82)], [X(22), Y(44)], [X(17), Y(42)]], top);
    out += C(X(28), Y(48), 3.6 * s, skin) + C(X(21), Y(40), 3.6 * s, skin);
    if (o.tool) out += L(X(30), Y(55), X(46), Y(2), AC.brownDk, 2.4 * s);
  } else if (pose === "hat") {
    // hat held at the chest
    out += P([[X(-13), Y(82)], [X(-8), Y(80)], [X(2), Y(64)], [X(-2), Y(60)]], top);
    out += P([[X(13), Y(82)], [X(8), Y(80)], [X(4), Y(64)], [X(9), Y(60)]], top);
    out += `<ellipse cx="${X(3)}" cy="${Y(63)}" rx="${12 * s}" ry="${4 * s}" fill="${AC.ochreLt}"/>`;
  } else if (pose === "hold") {
    out += P([[X(-13), Y(82)], [X(-8), Y(80)], [X(4), Y(62)], [X(0), Y(58)]], top);
    out += P([[X(13), Y(82)], [X(8), Y(80)], [X(12), Y(60)], [X(16), Y(62)]], top);
    out += C(X(6), Y(60), 3.4 * s, skin) + C(X(14), Y(60), 3.4 * s, skin);
  } else if (pose === "up") {
    out += P([[X(-13), Y(82)], [X(-8), Y(83)], [X(-14), Y(112)], [X(-19), Y(110)]], top);
    out += P([[X(13), Y(82)], [X(8), Y(80)], [X(12), Y(48)], [X(17), Y(49)]], top);
    out += C(X(-17), Y(113), 3.4 * s, skin) + C(X(14.5), Y(46), 3.4 * s, skin);
  }
  // neck and head
  out += R(X(-3) - (dir < 0 ? 6 * s : 0), Y(89), 6 * s, 7 * s, skin);
  out += `<ellipse cx="${X(0)}" cy="${Y(96)}" rx="${8 * s}" ry="${9.5 * s}" fill="${skin}"/>`;
  if (o.hat) {
    out += `<ellipse cx="${X(0)}" cy="${Y(102)}" rx="${15 * s}" ry="${3.4 * s}" fill="${o.hat}"/>`;
    out += P([[X(-8), Y(102)], [X(8), Y(102)], [X(6), Y(111)], [X(-6), Y(111)]], o.hat);
  }
  if (o.wrap) {
    out += P([[X(-9), Y(99)], [X(9), Y(99)], [X(10), Y(106)], [X(0), Y(110)], [X(-10), Y(106)]], o.wrap);
  }
  if (o.gray) out += `<ellipse cx="${X(0)}" cy="${Y(103)}" rx="${8.4 * s}" ry="${4 * s}" fill="${AC.paper2}"/>`;
  return `<g>${out}</g>`;
}

function mule(x, y, s, o = {}) {
  const col = o.color || AC.brownDk;
  const d = o.dir === "left" ? -1 : 1;
  const X = (dx) => x + dx * s * d, Y = (dy) => y - dy * s;
  let out = "";
  out += P([[X(-40), Y(52)], [X(30), Y(56)], [X(34), Y(30)], [X(-38), Y(30)]], col);
  [[-34], [-24], [20], [28]].forEach(([lx]) => { out += R(Math.min(X(lx), X(lx + 6)), Y(32), 6 * s, 32 * s, col); });
  if (o.down) {
    out += P([[X(30), Y(52)], [X(48), Y(30)], [X(62), Y(16)], [X(54), Y(10)], [X(36), Y(28)]], col);
  } else {
    out += P([[X(28), Y(56)], [X(44), Y(80)], [X(64), Y(70)], [X(60), Y(62)], [X(40), Y(48)]], col);
    out += P([[X(42), Y(80)], [X(40), Y(98)], [X(47), Y(82)]], col) + P([[X(47), Y(80)], [X(50), Y(97)], [X(52), Y(80)]], col);
  }
  out += P([[X(-40), Y(50)], [X(-50), Y(26)], [X(-46), Y(26)]], col);
  return `<g>${out}</g>`;
}

function cabin(x, y, w, h, o = {}) {
  const wall = o.wall || AC.brown, roof = o.roof || AC.brownDk;
  let out = R(x, y - h, w, h, wall);
  for (let i = 1; i < 6; i++) out += L(x, y - h + (h * i) / 6, x + w, y - h + (h * i) / 6, AC.brownDk, 2, 'opacity="0.45"');
  out += P([[x - w * 0.08, y - h], [x + w / 2, y - h - h * 0.62], [x + w * 1.08, y - h]], roof);
  out += R(x + w * 0.4, y - h * 0.62, w * 0.2, h * 0.62, o.door || AC.ink);
  out += R(x + w * 0.1, y - h * 0.7, w * 0.18, h * 0.22, o.window || AC.ink);
  out += R(x + w * 0.78, y - h - h * 0.5, w * 0.08, h * 0.35, AC.brownDk);
  return out;
}

function bigHouse(x, y, w, h) {
  let out = R(x, y - h, w, h, AC.cream);
  out += P([[x - w * 0.06, y - h], [x + w / 2, y - h - h * 0.45], [x + w * 1.06, y - h]], AC.brick);
  for (let i = 0; i < 6; i++) out += R(x + w * 0.06 + i * w * 0.17, y - h, w * 0.035, h, AC.paper2);
  for (let i = 0; i < 4; i++) out += R(x + w * 0.14 + i * w * 0.2, y - h * 0.8, w * 0.08, h * 0.24, AC.indigo);
  out += R(x + w * 0.44, y - h * 0.42, w * 0.12, h * 0.42, AC.indigo);
  return out;
}

function fieldRows(y0, y1, n, a, b, extra = "") {
  let out = "";
  for (let i = 0; i < n; i++) {
    const t0 = i / n, t1 = (i + 1) / n;
    const yA = y0 + (y1 - y0) * Math.pow(t0, 1.6), yB = y0 + (y1 - y0) * Math.pow(t1, 1.6);
    out += R(0, yA, 1600, yB - yA + 1, i % 2 ? a : b, extra);
  }
  return out;
}

function cottonDots(y0, y1, count, seed = 1) {
  let out = "", s = seed;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  for (let i = 0; i < count; i++) {
    const t = rnd();
    const y = y0 + (y1 - y0) * t;
    out += C(rnd() * 1600, y, 3 + 9 * t, AC.cotton);
  }
  return out;
}

function newspaper(x, y, w, h, mast, head, sub) {
  let out = R(x, y, w, h, AC.cream) + R(x, y, w, h, "none", `stroke="${AC.ink}" stroke-width="4"`);
  out += T(x + w / 2, y + 70, mast, { size: 34, weight: 700, font: "'Courier Prime', Courier, monospace", ls: 6 });
  out += L(x + 30, y + 92, x + w - 30, y + 92, AC.ink, 4) + L(x + 30, y + 100, x + w - 30, y + 100, AC.ink, 1.5);
  const lines = Array.isArray(head) ? head : [head];
  lines.forEach((ln, i) => { out += T(x + w / 2, y + 180 + i * 84, ln, { size: 76, weight: 900 }); });
  const subY = y + 180 + lines.length * 84 + 10;
  if (sub) out += T(x + w / 2, subY, sub, { size: 30, weight: 600, font: "'Public Sans', Arial, sans-serif" });
  for (let c = 0; c < 3; c++) {
    for (let r = 0; r < 7; r++) {
      const cx = x + 40 + c * ((w - 80) / 3);
      out += R(cx, subY + 40 + r * 26, (w - 80) / 3 - 30, 9, AC.gray, 'opacity="0.55"');
    }
  }
  return out;
}

function sceneSVG(name, label) {
  const fn = SCENES[name] || CARD_ART[name] || SCENES.fieldSun;
  return svgWrap(1600, 900, fn(), label);
}
function cardSVG(name, label) {
  const fn = CARD_ART[name] || SCENES[name] || SCENES.fieldSun;
  return svgWrap(1600, 900, fn(), label);
}

  function svgToTexture(svg) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas");
        c.width = img.naturalWidth || img.width; c.height = img.naturalHeight || img.height;
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        t.anisotropy = 4;
        resolve(t);
      };
      img.onerror = () => resolve(null);
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    });
  }

  function textTexture(lines, o = {}) {
    const c = document.createElement("canvas");
    c.width = o.w || 512; c.height = o.h || 160;
    const g = c.getContext("2d");
    g.fillStyle = o.bg || AC.cream; g.fillRect(0, 0, c.width, c.height);
    g.strokeStyle = AC.ink; g.lineWidth = 8; g.strokeRect(4, 4, c.width - 8, c.height - 8);
    g.fillStyle = o.fg || AC.ink; g.textAlign = "center"; g.textBaseline = "middle";
    lines.forEach((ln, i) => {
      g.font = `${i === 0 ? 800 : 600} ${o.size || 54}px Archivo, "Arial Narrow", sans-serif`;
      g.fillText(ln, c.width / 2, c.height / (lines.length + 1) * (i + 1));
    });
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }

  function grainTexture() {
    const c = document.createElement("canvas");
    c.width = c.height = 128;
    const g = c.getContext("2d");
    const img = g.createImageData(128, 128);
    for (let i = 0; i < img.data.length; i += 4) {
      const n = 225 + Math.random() * 30;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = n; img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(24, 24);
    return t;
  }

  // ---- building blocks ----------------------------------------------------
  function lambert(color, map) {
    const m = new THREE.MeshLambertMaterial({ color, map: map || null, flatShading: true });

  }
  function box(w, h, d, color, x, y, z, opts = {}) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), opts.mat || lambert(color, opts.map));

    if (opts.ry) m.rotation.y = opts.ry;
    scene.add(m);
    return m;
  }
  function roof(w, h, d, color, x, y, z) {
    const shape = new THREE.Shape();
    shape.moveTo(-w / 2, 0); shape.lineTo(0, h); shape.lineTo(w / 2, 0); shape.lineTo(-w / 2, 0);
    const geo = new THREE.ExtrudeGeometry(shape, { depth: d, bevelEnabled: false });
    geo.translate(0, 0, -d / 2);
    const m = new THREE.Mesh(geo, lambert(color));
    m.position.set(x, y, z);
    scene.add(m);
    return m;
  }
  function cutout(texName, height, x, z, o = {}) {
    const t = tex[texName];
    const img = t.image;
    const aspect = img.width / img.height;
    const w = height * aspect;
    const mat = new THREE.MeshBasicMaterial({ map: t, transparent: true, alphaTest: 0.35, side: THREE.DoubleSide });
    const geo = new THREE.PlaneGeometry(w, height);
    geo.translate(0, height / 2, 0);
    const m = new THREE.Mesh(geo, mat);
    const y = (o.y != null ? o.y : heightAt(x, z));
    m.position.set(x, y, z);
    if (o.billboard !== false) billboards.push(m);
    if (o.blob !== false) {
      const s = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.9, w * 0.35), mats.blob);
      s.rotation.x = -Math.PI / 2;
      s.position.set(0, 0.02, 0);
      m.add(s);
      m.userData.blob = s;
    }
    scene.add(m);
    return m;
  }
  function crossed(texName, height, x, z, y = 0) {
    const t = tex[texName];
    const aspect = t.image.width / t.image.height;
    const g = new THREE.Group();
    const mat = new THREE.MeshBasicMaterial({ map: t, transparent: true, alphaTest: 0.35, side: THREE.DoubleSide });
    for (let i = 0; i < 2; i++) {
      const geo = new THREE.PlaneGeometry(height * aspect, height);
      geo.translate(0, height / 2, 0);
      const m = new THREE.Mesh(geo, mat);
      m.rotation.y = i * Math.PI / 2 + 0.4;
      g.add(m);
    }
    g.position.set(x, y, z);
    scene.add(g);
    return g;
  }

  // ---- build the farm -------------------------------------------------------

    const cabinHot = box(1.2, 2, 1.2, 0, cab.x + 2.9, 0, cab.z, { mat: new THREE.MeshBasicMaterial({ visible: false }) });

    // the big house on the hill

    for (let i = 0; i < 6; i++) box(0.36, 4.6, 0.36, 0xf6efdf, bh.x - 5.6 + i * 2.24, bh.y + 0.4, bh.z + 6.2);
    box(13.4, 0.4, 3.4, 0xe2d4b6, bh.x, bh.y + 5, bh.z + 5);
    for (let i = 0; i < 4; i++) box(1.1, 1.5, 0.1, 0x2e3b56, bh.x - 4.5 + i * 3, bh.y + 1.4, bh.z + 3.52);
    box(1.6, 2.6, 0.1, 0x2e3b56, bh.x, bh.y + 0.4, bh.z + 3.53);
    for (let i = 0; i < 3; i++) box(3, 0.14, 0.5, 0xe2d4b6, bh.x, bh.y - 0.14 * (i + 1) + 0.28, bh.z + 6.8 + i * 0.5);
    colliders.push([bh.x - 7, bh.z - 3.8, bh.x + 7, bh.z + 6.6]);
    const bigHot = box(4, 3, 1, 0, bh.x, bh.y, bh.z + 6.8, { mat: new THREE.MeshBasicMaterial({ visible: false }) });

    const sx = -27, sz = -9;

    sb.position.set(sx, 1.6, sz); school.add(sb);
    const sr = roof(5.8, 2.2, 6.6, 0xa3271f, sx, 3.2, sz); scene.remove(sr); sr.rotation.y = Math.PI / 2; school.add(sr);
    const st2 = new THREE.Mesh(new THREE.BoxGeometry(1.1, 2.4, 1.1), lambert(0xf6efdf)); st2.position.set(sx + 2.2, 5, sz); school.add(st2);
    const sch = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2, 1.2), new THREE.MeshBasicMaterial({ visible: false }));
    sch.position.set(sx + 2.8, 1, sz); sch.userData.click = { kind: "place", name: "school" }; school.add(sch); clickables.push(sch);
    school.visible = false;
    scene.add(school);

    // trees and distant hills
    const treeSpots = [[-30, 18], [-24, 24], [-8, 26], [10, 25], [26, 22], [32, 4], [30, -14], [16, -22], [-16, -22], [-32, -2], [-36, 10], [22, -34], [-22, -36], [38, -26], [-40, -22], [6, 30], [-14, 32]];
    treeSpots.forEach(([x, z], i) => cutout(i % 2 ? "tree1" : "tree2", 6 + (i % 3), x, z));
    [[110, "hills2", 18], [130, "hills1", 30]].forEach(([rad, t, h]) => {
      for (let a = 0; a < 12; a++) {
        const ang = (a / 12) * Math.PI * 2;
        const m = new THREE.Mesh(new THREE.PlaneGeometry(rad * 0.58, h), new THREE.MeshBasicMaterial({ map: tex[t], transparent: true, fog: false }));

    // the family and the planter, as paper cutouts

    people.sam = cutout("sam", 1.12, -12.6, 12.6);
    people.ruth = cutout("ruth", 1.56, -14.4, 14.6, { y: 0.2 });

    // wagon for harvest

    }

    wagon.position.set(4, 0, 8);

<div id="app">
  <header id="topbar">
    <p class="brand">Settling Up</p>
    <ol id="years" aria-label="Crop years"></ol>
    <span id="fam"></span>
    <button class="topbtn" id="voice-btn" type="button" aria-pressed="true">Voice on</button>
    <button class="topbtn" id="journal-btn" type="button">Journal</button>
  </header>

  <div id="world">
    <div id="world-flat" hidden></div>
    <div class="world-tag" hidden></div>
    <div class="world-hint" hidden></div>
    <p class="world-help">W A S D or arrows to walk · drag to look · Shift to hurry</p>
  </div>

  <div class="world-bubble" hidden aria-live="polite"></div>

  <div id="captions" hidden aria-live="polite"><span class="cap-who"></span><span class="cap-what"></span></div>

  <div id="compass" hidden aria-live="polite">
    <span class="c-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2 L20 20 L12 15 L4 20 Z" fill="#A3271F"/></svg></span>
    <span class="c-text"></span>
    <span class="c-dist"></span>
  </div>

  <div id="pad" aria-label="Walk">
    <button type="button" data-key="arrowup" aria-label="Walk forward">▲</button>
    <button type="button" data-key="arrowleft" aria-label="Turn left">◀</button>
    <button type="button" data-key="arrowdown" aria-label="Walk back">▼</button>
    <button type="button" data-key="arrowright" aria-label="Turn right">▶</button>
  </div>

  <section id="dock" class="paper" hidden aria-live="polite"></section>

  <div id="sheet" hidden>
    <div id="sheet-body" class="paper" role="dialog" aria-modal="true"></div>
  </div>

  <div id="cutscene" hidden role="dialog" aria-modal="true" aria-label="Story"></div>

  <aside id="journal" class="paper" hidden aria-label="Journal">
    <div class="j-head"><h2>Journal</h2><button class="secondary" id="journal-close" type="button">Close</button></div>
    <div id="journal-list"></div>
  </aside>

</div>
